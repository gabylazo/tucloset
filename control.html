<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#FFFFFF">
<title>Centro de control · TuCloset</title>
<link rel="icon" href="iconos/icono-129-180.png">
<link rel="stylesheet" href="fuentes.css?v=0.123">
<!-- 04/11/2026 (Gabriela: «un sistema de control de la empresa… donde sepamos el estado de todo, de la empresa, de las cuentas, de los suscriptores, de las estadísticas de uso, de fallos»).
     Solo para las socias: los datos llegan de /api/control con su sesión de la app; esta página no lleva ningún dato dentro. -->
<style>
:root { --tinta: #4A3526; --gris: #7D6E63; --oro: #C9A24B; --raya: #E6DFD8; --suave: #F7F4F1; --blanco: #FFFFFF; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--blanco); color: var(--tinta); font: 400 16px/1.5 'Jost', system-ui, sans-serif; }
a { color: inherit; }
.cab { text-align: center; padding: 36px 16px 8px; }
.cab img { width: 40px; height: 40px; display: block; margin: 0 auto 10px; }
.marca { font: 400 30px/1 'Bellefair', serif; margin: 0; letter-spacing: .01em; }
.marca span { color: var(--oro); }
.cab p { margin: 6px 0 0; color: var(--gris); font-size: 15px; }
nav { position: sticky; top: 0; z-index: 2; background: var(--blanco); border-bottom: 1px solid var(--raya); overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav ul { display: flex; gap: 4px; justify-content: safe center; margin: 0; padding: 0 12px; list-style: none; min-width: max-content; }
nav a { display: block; padding: 12px 10px; min-height: 44px; font-size: 14px; letter-spacing: .04em; text-decoration: none; color: var(--gris); }
nav a:hover, nav a:focus-visible { color: var(--tinta); }
main { max-width: 760px; margin: 0 auto; padding: 0 16px 64px; }
section { padding-top: 40px; scroll-margin-top: 48px; }
h2 { font: 400 26px/1.2 'Bellefair', serif; text-align: center; margin: 0 0 6px; }
.sub { text-align: center; color: var(--gris); font-size: 15px; margin: 0 0 20px; }
h3 { font: 400 20px/1.25 'Bellefair', serif; margin: 0; }
:focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; }

/* estado: un cuadrado, como los botones de la app */
.e { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--gris); white-space: nowrap; }
.e::before { content: ''; width: 10px; height: 10px; flex: none; border: 1.5px solid var(--tinta); }
.e.hecho::before, .e.ok::before { background: var(--tinta); }
.e.marcha::before, .e.medio::before { background: linear-gradient(90deg, var(--tinta) 50%, transparent 50%); }
.e.espera::before { border-style: dashed; }

/* os toca */
.toca { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--raya); }
.toca li { padding: 14px 0; border-bottom: 1px solid var(--raya); display: grid; grid-template-columns: 84px 1fr; gap: 4px 12px; }
.toca .q { font-size: 13px; letter-spacing: .04em; color: var(--gris); padding-top: 2px; }
.toca .r { grid-column: 2; font-size: 14px; color: var(--gris); }

/* cifras, como los datos de un perfil */
.cifras { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--raya); border-bottom: 1px solid var(--raya); }
.cifras div { text-align: center; padding: 18px 6px; }
.cifras div + div { border-left: 1px solid var(--raya); }
.cifras div:nth-child(4) { border-left: 0; }
.cifras div:nth-child(n+4) { border-top: 1px solid var(--raya); }
.cifras b { display: block; font: 400 34px/1.1 'Bellefair', serif; }
.cifras span { font-size: 13px; color: var(--gris); }
@media (min-width: 640px) { .cifras { grid-template-columns: repeat(6, minmax(0, 1fr)); } .cifras div:nth-child(4) { border-left: 1px solid var(--raya); } .cifras div:nth-child(n+4) { border-top: 0; } }

.barras { display: flex; align-items: flex-end; gap: 4px; height: 120px; margin-top: 22px; padding: 0 2px; }
.barras div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
.barras i { display: block; width: 100%; max-width: 26px; background: var(--tinta); min-height: 1px; }
.barras small { font-size: 11px; color: var(--gris); }
.barras em { font-style: normal; font-size: 12px; }

/* departamentos */
.dep { border-top: 1px solid var(--raya); padding: 18px 0; }
.dep:last-child { border-bottom: 1px solid var(--raya); }
.dep .quien { font-size: 13px; color: var(--gris); margin: 2px 0 6px; }
.dep p { margin: 0 0 10px; font-size: 15px; }
.tareas { list-style: none; margin: 0; padding: 0; }
.tareas li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 6px 0; font-size: 15px; }
.tareas li small { grid-column: 1 / -1; color: var(--gris); font-size: 13px; }
.cuenta-dep { text-align: center; font-size: 14px; color: var(--gris); margin: 0 0 18px; }

/* filas de tabla en el móvil */
.filas { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--raya); }
.filas li { padding: 12px 0; border-bottom: 1px solid var(--raya); display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
.filas .n { grid-column: 1 / -1; font-size: 13px; color: var(--gris); }
.grupo { font: 400 18px/1.3 'Bellefair', serif; margin: 22px 0 6px; text-align: center; }
.v { font-size: 12px; letter-spacing: .08em; color: var(--gris); }

.fase { border-top: 1px solid var(--raya); padding: 14px 0; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
.fase:last-of-type { border-bottom: 1px solid var(--raya); }
.fase .o, .fase .d { grid-column: 1 / -1; font-size: 14px; color: var(--gris); }
.fase .barra { grid-column: 1 / -1; height: 4px; background: var(--suave); margin-top: 6px; }
.fase .barra i { display: block; height: 100%; background: var(--tinta); }
.total { text-align: center; margin: 22px 0 0; }
.total b { font: 400 30px/1.1 'Bellefair', serif; display: block; }
.total p { margin: 6px auto 0; max-width: 46ch; font-size: 14px; color: var(--gris); }

.tabla { width: 100%; border-collapse: collapse; font-size: 14px; }
.tabla th { font-weight: 400; color: var(--gris); font-size: 12px; letter-spacing: .04em; text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--raya); }
.tabla td { padding: 10px 6px; border-bottom: 1px solid var(--raya); vertical-align: top; }
.tabla td.num, .tabla th.num { text-align: right; font-variant-numeric: tabular-nums; }
.desliza { overflow-x: auto; }

.vacio, .aviso { text-align: center; color: var(--gris); font-size: 15px; margin: 8px 0; }
.mensaje { max-width: 34ch; margin: 80px auto; text-align: center; padding: 0 16px; }
.mensaje h2 { margin-bottom: 12px; }
.boton { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 22px; margin-top: 18px; border: 1px solid var(--tinta); text-decoration: none; letter-spacing: .08em; font-size: 14px; }
.pie { text-align: center; color: var(--gris); font-size: 13px; margin-top: 48px; }
.fallos li { font-size: 13px; }
.doc { border-top: 1px solid var(--raya); }
.doc:last-of-type { border-bottom: 1px solid var(--raya); }
.doc summary { list-style: none; cursor: pointer; padding: 14px 28px 14px 0; position: relative; min-height: 44px; }
.doc summary::-webkit-details-marker { display: none; }
.doc summary::after { content: '+'; position: absolute; right: 4px; top: 12px; font-size: 22px; line-height: 1; }
.doc[open] summary::after { content: '–'; }
.doc summary .n { display: block; font-size: 13px; color: var(--gris); }
.doc-cuerpo { padding: 0 0 24px; font-size: 15px; }
.doc-cuerpo h4 { font: 400 19px/1.3 'Bellefair', serif; margin: 22px 0 6px; }
.doc-cuerpo p, .doc-cuerpo li { max-width: 68ch; }
.doc-cuerpo ul, .doc-cuerpo ol { padding-left: 20px; margin: 6px 0 12px; }
.doc-cuerpo table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0 14px; }
.doc-cuerpo td, .doc-cuerpo th { border-bottom: 1px solid var(--raya); padding: 7px 6px; text-align: left; vertical-align: top; font-weight: 400; }
.doc-cuerpo th { color: var(--gris); font-size: 12px; }
.fallos code { font: 12px/1.4 ui-monospace, Menlo, monospace; color: var(--tinta); word-break: break-word; }
</style>
</head>
<body>
<header class="cab">
  <img src="iconos/icono-129-180.png" alt="">
  <h1 class="marca">Tu<span>Closet</span></h1>
  <p>Centro de control</p>
</header>
<div id="raiz"><p class="aviso" style="margin-top:40px">Cargando…</p></div>
<script>
(async () => {
  const raiz = document.getElementById('raiz');
  const API = (() => { try { const q = localStorage.getItem('tc_api'); if (q) return q; } catch (e) { } return /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://localhost:8787' : 'https://tucloset-api.apptucloset.workers.dev'; })();
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const mensaje = (tit, txt, boton) => { raiz.innerHTML = `<div class="mensaje"><h2>${tit}</h2><p class="sub">${txt}</p>${boton ? `<a class="boton" href="./">${boton}</a>` : ''}</div>`; };
  let c = null; try { c = JSON.parse(localStorage.getItem('tc_cuenta') || 'null'); } catch (e) { }
  if (!c?.token) return mensaje('Entra primero', 'Abre tu cuenta en la app y vuelve a esta página.', 'Ir a la app');
  let r; try { r = await fetch(API + '/api/control', { headers: { Authorization: 'Bearer ' + c.token } }); } catch (e) { return mensaje('Sin conexión', 'No he podido hablar con el servidor. Prueba otra vez en un momento.'); }
  if (r.status === 401) return mensaje('Tu sesión ha caducado', 'Vuelve a entrar en la app y abre otra vez esta página.', 'Ir a la app');
  if (r.status === 403) return mensaje('Página privada', 'Este centro de control es solo para las socias de TuCloset.', 'Ir a la app');
  if (!r.ok) return mensaje('Algo ha fallado', `El servidor ha respondido ${r.status}. Prueba otra vez en un momento.`);
  const d = await r.json(), P = d.panel || {};
  const EST = { hecho: 'Hecho', marcha: 'En marcha', falta: 'Falta', espera: 'Espera', ok: 'Funciona', medio: 'A medias' };
  const est = e => `<span class="e ${esc(e)}">${EST[e] || esc(e)}</span>`;
  const fecha = iso => { if (!iso) return '—'; const f = new Date(iso); return f.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' }); };
  const hora = iso => new Date(iso).toLocaleString('es-ES', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const hoy = new Date(), dia = n => new Date(hoy - n * 864e5).toISOString().slice(0, 10);
  const activas7 = new Set(d.uso.filter(u => u.dia >= dia(6)).map(u => u.usuaria)).size;
  const fallos7 = d.avisos.filter(a => a.fecha >= new Date(hoy - 7 * 864e5).toISOString()).length;
  const prendas = d.usuarias.reduce((s, u) => s + u.prendas, 0);
  const secciones = [['toca', 'Os toca'], ['mirar', 'Para mirar'], ['cifras', 'Cifras'], ['departamentos', 'Departamentos'], ['funciones', 'Funciones'], ['fases', 'Fases'], ['cuentas', 'Cuentas'], ['usuarias', 'Usuarias'], ['encuesta', 'Encuesta'], ['documentos', 'Documentos'], ['fallos', 'Fallos']];

  // uso de los últimos 14 días: cuántas personas abrieron la app cada día
  const dias = [...Array(14)].map((_, i) => dia(13 - i)), porDia = dias.map(k => new Set(d.uso.filter(u => u.dia === k).map(u => u.usuaria)).size), max = Math.max(1, ...porDia);
  const barras = `<div class="barras" role="img" aria-label="Personas que abrieron la app cada día, últimos 14 días: ${porDia.join(', ')}">${dias.map((k, i) => `<div><em>${porDia[i] || ''}</em><i style="height:${Math.round(porDia[i] / max * 86)}%"></i><small>${+k.slice(8)}</small></div>`).join('')}</div>`;

  // encuesta: cuántas eligieron cada respuesta
  let enc = '<p class="vacio">Aún no hay respuestas. La encuesta sale en la app al séptimo día de prueba.</p>';
  if (d.encuestas.length) { const cuenta = {}; d.encuestas.forEach(x => Object.entries(x.r).forEach(([q, v]) => { (cuenta[q] = cuenta[q] || {}); [].concat(v).forEach(o => cuenta[q][o] = (cuenta[q][o] || 0) + 1); }));
    enc = `<p class="sub">${d.encuestas.length} respuesta${d.encuestas.length > 1 ? 's' : ''}</p>` + Object.entries(cuenta).map(([q, ops]) => `<h3 class="grupo">${esc(q)}</h3><ul class="filas">${Object.entries(ops).sort((a, b) => b[1] - a[1]).map(([o, n]) => `<li><span>${esc(o)}</span><span>${n}</span></li>`).join('')}</ul>`).join(''); }

  const grupos = [...new Set((P.funciones || []).map(f => f.g))];
  const hechas = (P.funciones || []).filter(f => f.e === 'hecho').length;
  raiz.innerHTML = `<nav aria-label="Secciones"><ul>${secciones.map(([k, n]) => `<li><a href="#${k}">${n}</a></li>`).join('')}</ul></nav><main>
  <section id="toca"><h2>Os toca</h2><p class="sub">Lo que solo podéis decidir o hacer vosotras. Entre paréntesis, lo que recomiendo.</p>
    <ul class="toca">${(P.pendientes || []).map(p => `<li><span class="q">${esc(p.q)}</span><span>${esc(p.t)}</span>${p.r ? `<span class="r">(${esc(p.r)})</span>` : ''}</li>`).join('')}</ul></section>
  <section id="mirar"><h2>Para mirar</h2><p class="sub">Todo lo que tenéis que ver, junto.</p>
    <ul class="filas">${(P.mirar || []).map(x => `<li><span>${x.url ? `<a href="${esc(x.url)}">${esc(x.t)}</a>` : esc(x.t)}</span>${x.e ? est(x.e) : '<span></span>'}${x.n ? `<span class="n">${esc(x.n)}</span>` : ''}</li>`).join('')}</ul></section>
  <section id="cifras"><h2>Cifras</h2><p class="sub">Datos reales del servidor.</p>
    <div class="cifras"><div><b>${d.usuarias.length}</b><span>cuentas</span></div><div><b>${activas7}</b><span>activas en 7 días</span></div><div><b>${prendas}</b><span>prendas subidas</span></div>
    <div><b>0</b><span>suscriptoras (aún no se cobra)</span></div><div><b>${d.entradas7}</b><span>entradas en 7 días</span></div><div><b>${fallos7}</b><span>fallos en 7 días</span></div></div>
    ${barras}<p class="sub" style="margin-top:8px">Personas que abrieron la app cada día (se cuenta desde el 04/11).</p>
    <h3 class="grupo">Próximas fechas</h3><ul class="filas">${(P.calendario || []).map(x => `<li><span>${esc(x.q)}</span><span>${esc(x.f)}</span></li>`).join('')}</ul></section>
  <section id="departamentos"><h2>Departamentos</h2><p class="sub">Cada departamento es un agente que trabaja bajo la Dirección.</p>
    ${(P.departamentos || []).map(x => `<div class="dep"><h3>${esc(x.n)}</h3><p class="quien">${esc(x.quien)}</p><p>${esc(x.hace)}</p><ul class="tareas">${x.tareas.map(tk => `<li><span>${esc(tk.t)}</span>${est(tk.e)}${tk.n ? `<small>${esc(tk.n)}</small>` : ''}</li>`).join('')}</ul></div>`).join('')}</section>
  <section id="funciones"><h2>Funciones de la app</h2><p class="sub">${hechas} de ${(P.funciones || []).length} hechas. G, B y P son Gratis, Básico y Pro.</p>
    ${grupos.map(g => `<h3 class="grupo">${esc(g)}</h3><ul class="filas">${P.funciones.filter(f => f.g === g).map(f => `<li><span>${esc(f.f)}</span>${est(f.e)}<span class="n"><span class="v">${esc(f.v)}</span>${f.n ? ` · ${esc(f.n)}` : ''}</span></li>`).join('')}</ul>`).join('')}</section>
  <section id="fases"><h2>Fases y presupuesto</h2><p class="sub">Con las fechas adelantadas, pendientes de vuestro sí.</p>
    ${(P.fases || []).map(f => `<div class="fase"><h3>${esc(f.n)}</h3><span>${(+f.m).toLocaleString('es-ES')} €</span><span class="d">${esc(f.i)} – ${esc(f.f)} · ${Math.round(f.a * 100)} % hecho</span><span class="o">${esc(f.o)}</span><div class="barra" aria-hidden="true"><i style="width:${Math.round(f.a * 100)}%"></i></div></div>`).join('')}
    ${P.presupuesto ? `<div class="total"><b>${P.presupuesto.total.toLocaleString('es-ES')} €</b><span>hasta octubre de 2027</span><p>${P.presupuesto.antes} € antes de cobrar. Después, unos ${P.presupuesto.fijos} € al mes de gastos fijos, que se cubren con unas ${P.presupuesto.cubren} suscriptoras. ${esc(P.presupuesto.nota)}</p></div>` : ''}
    ${P.fijos ? `<h3 class="grupo">Gastos fijos al mes, desde que se cobre</h3><ul class="filas">${P.fijos.map(([n, v]) => `<li><span>${esc(n)}</span><span>${v} €</span></li>`).join('')}</ul>` : ''}</section>
  <section id="cuentas"><h2>Cuentas de la empresa</h2><p class="sub">${esc(P.nota_claves || '')}</p>
    <ul class="filas">${(P.cuentas || []).map(x => `<li><span><b style="font-weight:500">${esc(x.s)}</b> · ${esc(x.p)}</span>${est(x.e)}<span class="n">${esc(x.d)}${x.n ? ` · ${esc(x.n)}` : ''}</span></li>`).join('')}</ul></section>
  <section id="usuarias"><h2>Usuarias</h2><p class="sub">Los correos van abreviados. Sin fotos ni datos del cuerpo.</p>
    <div class="desliza" tabindex="0" role="region" aria-label="Tabla de usuarias"><table class="tabla"><thead><tr><th>Cuenta</th><th>Alta</th><th class="num">Prendas</th><th class="num">Looks</th><th class="num">Puestas</th><th>Versión</th><th>Última vez</th></tr></thead>
    <tbody>${d.usuarias.sort((a, b) => (b.actualizado || '').localeCompare(a.actualizado || '')).map(u => `<tr><td>${esc(u.correo)}</td><td>${fecha(u.creada)}</td><td class="num">${u.prendas}${u.catalogo ? ` (${u.catalogo} de catálogo)` : ''}</td><td class="num">${u.looks}</td><td class="num">${u.usos}</td><td>${esc({ gratis: 'Gratis', basico: 'Básico', pro: 'Pro' }[u.ve] || '—')}</td><td>${fecha(u.actualizado)}</td></tr>`).join('')}</tbody></table></div></section>
  <section id="encuesta"><h2>Encuesta de las pruebas</h2>${enc}</section>
  <section id="documentos"><h2>Documentos</h2>${(P.docs || []).length ? P.docs.map(x => `<details class="doc"><summary><h3>${esc(x.t)}</h3><span class="n">${esc(x.n || '')}</span></summary><div class="doc-cuerpo">${x.html}</div></details>`).join('') : '<p class="vacio">Aún no hay documentos.</p>'}</section>
  <section id="fallos"><h2>Fallos</h2><p class="sub">Lo que la app avisa cuando algo no llega al servidor. Sin datos de nadie.</p>
    ${d.avisos.length ? `<ul class="filas fallos">${d.avisos.slice(0, 20).map(a => `<li><code>${esc(a.d)}</code><span>${hora(a.fecha)}</span></li>`).join('')}</ul>` : '<p class="vacio">Ningún fallo.</p>'}</section>
  <p class="pie">Datos del servidor: ${hora(d.generado)}. Panel de la Dirección: ${esc(P.actualizado || '—')}.</p>
  </main>`;
})();
</script>
</body>
</html>
