<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#FFFFFF">
<title>Centro de control · TuCloset</title>
<link rel="icon" href="iconos/icono-129-180.png">
<link rel="stylesheet" href="fuentes.css?v=0.123">
<!-- 04/11/2026 (Gabriela: «un sistema de control de la empresa… donde sepamos el estado de todo»). Solo para las socias: los datos llegan de /api/control
     con su sesión de la app; esta página no lleva ningún dato dentro.
     11/11 (Gabriela, por Coordinación de marketing: «que lo optimice mucho más, que ponga más gráficos; tiene muchísimo texto y me da pereza leerlo»):
     cinco pestañas (Hoy, Cifras, Dinero, Redes, Empresa); en cada una, primero un gráfico o una cifra y, como mucho, una línea; lo demás, plegado.
     Copia anterior: prototipo/control.html.antes-graficos. -->
<style>
:root { --tinta: #4A3526; --gris: #74655A; --oro: #C9A24B; --raya: #E6DFD8; --suave: #F7F4F1; --blanco: #FFFFFF;
  --hecho: #2E6B4A; --marcha: #B08A2E; --sube: #2E6B4A; --baja: #8E3B2E; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--blanco); color: var(--tinta); font: 400 16px/1.45 'Jost', system-ui, sans-serif; }
a { color: inherit; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; }

.cab { position: relative; text-align: center; padding: 22px 16px 4px; }
.cab img { width: 32px; height: 32px; display: block; margin: 0 auto 6px; }
.marca { font: 400 26px/1 'Bellefair', serif; margin: 0; }
.marca span { color: var(--oro); }
.cab p { margin: 2px 0 0; color: var(--gris); font-size: 14px; }
.volver { position: absolute; left: 8px; top: 10px; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 8px; font-size: 14px; text-decoration: none; color: var(--gris); }
.volver svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; }
.volver:hover { color: var(--tinta); }
@media (max-width: 420px) { .volver span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } }

nav { position: sticky; top: 0; z-index: 3; background: var(--blanco); border-bottom: 1px solid var(--raya); overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav ul { display: flex; justify-content: safe center; margin: 0; padding: 0 8px; list-style: none; min-width: max-content; }
nav a { display: block; padding: 12px 11px; min-height: 44px; font-size: 15px; text-decoration: none; color: var(--gris); }
nav a:hover { color: var(--tinta); }
nav a[aria-current] { color: var(--tinta); box-shadow: inset 0 -2px 0 var(--tinta); }

main { max-width: 1040px; margin: 0 auto; padding: 0 16px 56px; }
section { padding-top: 22px; }
.bloque { margin-top: 28px; }
.tit { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 10px; }
h3 { font: 400 22px/1.2 'Bellefair', serif; margin: 0; }
.tit small, .peq { font-size: 13px; color: var(--gris); }
.dos { display: grid; gap: 28px; }
@media (min-width: 820px) { .dos { grid-template-columns: 1fr 1fr; } .dos .bloque { margin-top: 0; } .dos { margin-top: 28px; } }

/* cifras sueltas: la cifra primero, una etiqueta corta debajo */
.tiles { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 760px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--suave); padding: 16px 14px 14px; min-height: 96px; display: flex; flex-direction: column; justify-content: center; }
.tile b { font: 500 32px/1.05 'Jost', sans-serif; letter-spacing: -.01em; }
.tile b small { font-size: 18px; font-weight: 400; margin-left: 2px; }
.tile span { margin-top: 4px; font-size: 13px; line-height: 1.3; color: var(--gris); }
.flecha { font-size: 14px; margin-left: 6px; vertical-align: middle; }
.flecha.sube { color: var(--sube); } .flecha.baja { color: var(--baja); }
.heroe { text-align: center; padding: 6px 0 2px; }
.heroe b { display: block; font: 500 56px/1 'Jost', sans-serif; letter-spacing: -.02em; }
.heroe b small { font-size: 26px; font-weight: 400; margin-left: 4px; }
.heroe > span { display: block; margin-top: 6px; font-size: 14px; color: var(--gris); }

/* medidor: de cuánto se ha gastado de un tope */
.medidor { margin-top: 10px; }
.medidor .pista { height: 8px; background: var(--raya); border-radius: 4px; overflow: hidden; }
.medidor .pista i { display: block; height: 100%; background: var(--tinta); border-radius: 0 4px 4px 0; }
.medidor .pista i.alto { background: var(--baja); }
.medidor p { display: flex; justify-content: space-between; margin: 6px 0 0; font-size: 13px; color: var(--gris); }
.tile .medidor { margin-top: 8px; } .tile .medidor .pista { height: 6px; }

/* os toca: una línea por cosa; la explicación al tocar */
.toca { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--raya); }
.toca li { border-bottom: 1px solid var(--raya); }
.toca summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto 18px; gap: 2px 12px; align-items: center; padding: 11px 0; min-height: 52px; }
.toca summary::-webkit-details-marker { display: none; }
.toca summary::after { content: '+'; grid-column: 3; grid-row: 1 / 3; font-size: 20px; line-height: 1; color: var(--gris); text-align: center; }
.toca details[open] summary::after { content: '–'; }
.toca .que { grid-column: 1; font-size: 16px; line-height: 1.3; }
.toca .quien { grid-column: 1; font-size: 13px; color: var(--gris); }
.toca .cuando { grid-column: 2; grid-row: 1 / 3; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.toca .cuando.ya { color: var(--baja); font-weight: 500; }
.toca p { margin: 0 0 14px; max-width: 62ch; font-size: 15px; color: var(--gris); }

/* fechas: una línea con puntos */
.linea { list-style: none; margin: 0; padding: 0 0 0 4px; }
.linea li { position: relative; display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; padding: 0 0 14px 20px; border-left: 1px solid var(--raya); }
.linea li:last-child { border-left-color: transparent; padding-bottom: 0; }
.linea li::before { content: ''; position: absolute; left: -5px; top: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--tinta); box-shadow: 0 0 0 2px var(--blanco); }
.linea li.lejos::before { background: var(--blanco); border: 1.5px solid var(--tinta); width: 9px; height: 9px; }
.linea b { font-weight: 500; font-variant-numeric: tabular-nums; font-size: 15px; }
.linea span { font-size: 15px; line-height: 1.35; }

.enlaces { display: flex; flex-wrap: wrap; gap: 8px; }
.enlaces a, .enlaces span { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border: 1px solid var(--tinta); text-decoration: none; font-size: 15px; }
.enlaces span { border-style: dashed; color: var(--gris); border-color: var(--raya); }
.enlaces a:hover { background: var(--suave); }

/* gráficos */
figure { margin: 0; }
.graf { background: var(--blanco); }
.plot { position: relative; height: 150px; margin: 30px 8px 0 28px; }
.plot .rej { position: absolute; left: 0; right: 0; border-top: 1px solid var(--raya); }
.plot .rej span { position: absolute; right: calc(100% + 6px); top: -8px; font-size: 12px; color: var(--gris); font-variant-numeric: tabular-nums; }
.plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.plot .area { fill: var(--tinta); fill-opacity: .08; stroke: none; }
.plot .trazo { fill: none; stroke: var(--tinta); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.plot .pt { position: absolute; width: 24px; height: 100%; top: 0; transform: translateX(-50%); }
.plot .pt i { position: absolute; left: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--tinta); box-shadow: 0 0 0 2px var(--blanco); opacity: 0; }
.plot .pt i.fin, .plot .pt:hover i, .plot .pt:focus-visible i { opacity: 1; }
.plot .pt:hover::before, .plot .pt:focus-visible::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1px solid var(--raya); }
.plot .pt em { position: absolute; left: 50%; transform: translate(-50%, -26px); background: var(--blanco); padding: 0 2px; font-style: normal; font-size: 13px; font-weight: 500; white-space: nowrap; }
.plot .pt em.der { transform: translate(-100%, -26px); }
.ejex { display: flex; justify-content: space-between; margin: 6px 8px 0 28px; font-size: 12px; color: var(--gris); font-variant-numeric: tabular-nums; }
.cols { position: relative; display: flex; align-items: flex-end; gap: 2px; height: 150px; margin-top: 4px; border-bottom: 1px solid var(--raya); }
.cols > div { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-width: 0; }
.cols > div:hover i, .cols > div:focus-visible i { opacity: .75; }
.cols i { display: block; width: 100%; max-width: 24px; background: var(--tinta); border-radius: 4px 4px 0 0; min-height: 2px; }
.cols i.cero { background: var(--raya); }
.cols em { font-style: normal; font-size: 13px; font-weight: 500; margin-bottom: 4px; min-height: 1em; }
.colx { display: flex; gap: 2px; margin-top: 6px; }
.colx span { flex: 1; text-align: center; font-size: 12px; color: var(--gris); font-variant-numeric: tabular-nums; min-width: 0; }
.hbar { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.hbar li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; font-size: 14px; }
.hbar li .nom { overflow-wrap: anywhere; }
.hbar li .val { font-variant-numeric: tabular-nums; color: var(--gris); white-space: nowrap; }
.hbar li .pista { grid-column: 1 / -1; height: 10px; }
.hbar li .pista i { display: block; height: 100%; min-width: 2px; background: var(--tinta); border-radius: 0 4px 4px 0; }
.hbar li .pista i.suave { background: #A99A8E; }
.ver-tabla { margin-top: 8px; }
.ver-tabla summary { cursor: pointer; display: inline-flex; align-items: center; min-height: 44px; font-size: 13px; color: var(--gris); text-decoration: underline; text-underline-offset: 3px; }
.vacio { color: var(--gris); font-size: 15px; margin: 4px 0; }

/* estados: cuadrado relleno, medio o vacío (la forma dice el estado; el color ayuda) */
.e { display: inline-block; width: 12px; height: 12px; flex: none; border: 1.5px solid var(--tinta); vertical-align: -1px; }
.e.hecho, .e.ok { background: var(--hecho); border-color: var(--hecho); }
.e.marcha, .e.medio { border-color: var(--marcha); background: linear-gradient(90deg, var(--marcha) 50%, transparent 50%); }
.e.espera { border-style: dashed; border-color: var(--gris); }
.apilada { display: flex; gap: 2px; height: 14px; margin-top: 14px; }
.apilada i { display: block; height: 100%; }
.apilada i:first-child { border-radius: 4px 0 0 4px; } .apilada i:last-child { border-radius: 0 4px 4px 0; }
.apilada .hecho { background: var(--hecho); } .apilada .marcha { background: var(--marcha); } .apilada .falta { background: var(--raya); } .apilada .espera { background: #EFEAE5; }
.leyenda { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; margin-top: 10px; font-size: 14px; color: var(--gris); }
.leyenda span { display: inline-flex; align-items: center; gap: 7px; }
.leyenda b { color: var(--tinta); font-weight: 500; }

/* filas plegables (grupos de funciones, equipo, legal, documentos) */
.plegables { border-top: 1px solid var(--raya); }
.plegables details { border-bottom: 1px solid var(--raya); }
.plegables summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) 72px 44px 18px; gap: 12px; align-items: center; min-height: 52px; padding: 6px 0; }
.plegables summary::-webkit-details-marker { display: none; }
.plegables summary::after { content: '+'; font-size: 20px; color: var(--gris); text-align: center; }
.plegables details[open] > summary::after { content: '–'; }
.plegables summary .nom { font-size: 16px; line-height: 1.3; }
.plegables summary .mini { height: 6px; background: var(--raya); border-radius: 3px; overflow: hidden; }
.plegables summary .mini i { display: block; height: 100%; background: var(--hecho); }
.plegables summary .cu { font-size: 14px; color: var(--gris); text-align: right; font-variant-numeric: tabular-nums; }
.plegables.sin-barra summary { grid-template-columns: minmax(0, 1fr) auto 18px; }
.lista { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 8px; }
.lista li { display: grid; grid-template-columns: 12px 1fr; gap: 10px; align-items: start; font-size: 15px; line-height: 1.3; }
.lista li .e { margin-top: 3px; }
.lista small { display: block; color: var(--gris); font-size: 13px; }
.cuerpo { padding: 0 0 20px; font-size: 15px; }
.cuerpo h1, .cuerpo h2 { font: 400 22px/1.25 'Bellefair', serif; margin: 18px 0 6px; }
.cuerpo h3, .cuerpo h4 { font: 400 19px/1.3 'Bellefair', serif; margin: 18px 0 6px; }
.cuerpo p, .cuerpo li { max-width: 70ch; }
.cuerpo ul, .cuerpo ol { padding-left: 20px; margin: 6px 0 12px; }
.cuerpo table, .tabla { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0 14px; }
.cuerpo td, .cuerpo th, .tabla td, .tabla th { border-bottom: 1px solid var(--raya); padding: 8px 6px; text-align: left; vertical-align: top; font-weight: 400; }
.cuerpo th, .tabla th { color: var(--gris); font-size: 12px; }
.tabla .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tabla th[scope=row] { color: var(--tinta); font-size: 14px; overflow-wrap: anywhere; }
.tabla.red th[scope=row] { white-space: nowrap; overflow-wrap: normal; }
.tabla.red th[scope=row] .e { margin-right: 6px; }
.desliza { overflow-x: auto; }
.filas { list-style: none; margin: 0; padding: 0; }
.filas li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--raya); font-size: 15px; }
.filas li span:last-child { white-space: nowrap; color: var(--gris); font-size: 14px; font-variant-numeric: tabular-nums; }
.filas code { font: 12px/1.4 ui-monospace, Menlo, monospace; word-break: break-word; }

/* fases: una barra por fase */
.fases { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.fases li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
.fases .nom { font-size: 16px; }
.fases .nom small { margin-left: 8px; font-size: 13px; color: var(--gris); font-variant-numeric: tabular-nums; }
.fases .eur { font-size: 15px; font-variant-numeric: tabular-nums; }
.fases .pista { grid-column: 1 / -1; height: 8px; background: var(--raya); border-radius: 4px; overflow: hidden; }
.fases .pista i { display: block; height: 100%; background: var(--hecho); }

.cuentas { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--raya); }
.cuentas li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 48px; border-bottom: 1px solid var(--raya); font-size: 15px; }
.cuentas a { display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; text-underline-offset: 3px; }

.acciones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.boton { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border: 1px solid var(--tinta); background: var(--blanco); color: var(--tinta); text-decoration: none; font: inherit; font-size: 14px; cursor: pointer; }
.boton:hover { background: var(--suave); }
.mensaje { max-width: 34ch; margin: 80px auto; text-align: center; padding: 0 16px; }
.mensaje h2 { font: 400 28px/1.2 'Bellefair', serif; margin: 0 0 8px; }
.mensaje p { color: var(--gris); }
.pie { text-align: center; color: var(--gris); font-size: 13px; margin-top: 40px; }

#tip { position: fixed; z-index: 9; pointer-events: none; background: var(--tinta); color: var(--blanco); padding: 6px 10px; font-size: 13px; line-height: 1.3; max-width: 240px; opacity: 0; transition: opacity .12s; }
#tip b { display: block; font-size: 15px; font-weight: 500; }
@media (prefers-reduced-motion: reduce) { #tip { transition: none; } }
</style>
</head>
<body>
<header class="cab">
  <a class="volver" href="./"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg><span>Volver a la app</span></a>
  <img src="iconos/icono-129-180.png" alt="">
  <h1 class="marca">Tu<span>Closet</span></h1>
  <p>Centro de control</p>
</header>
<div id="raiz"><p class="vacio" style="text-align:center;margin-top:40px">Cargando…</p></div>
<div id="tip" aria-hidden="true"></div>
<script>
(async () => {
  const raiz = document.getElementById('raiz');
  const API = (() => { try { const q = localStorage.getItem('tc_api'); if (q) return q; } catch (e) { } return /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://localhost:8787' : 'https://tucloset-api.apptucloset.workers.dev'; })();
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const mensaje = (tit, txt, boton) => { raiz.innerHTML = `<div class="mensaje"><h2>${tit}</h2><p>${txt}</p>${boton ? `<a class="boton" href="./">${boton}</a>` : ''}</div>`; };
  let c = null; try { c = JSON.parse(localStorage.getItem('tc_cuenta') || 'null'); } catch (e) { }
  if (!c?.token) return mensaje('Entra primero', 'Abre tu cuenta en la app y vuelve a esta página.', 'Ir a la app');
  let r; try { r = await fetch(API + '/api/control', { headers: { Authorization: 'Bearer ' + c.token } }); } catch (e) { return mensaje('Sin conexión', 'No he podido hablar con el servidor. Prueba otra vez en un momento.'); }
  if (r.status === 401) return mensaje('Tu sesión ha caducado', 'Vuelve a entrar en la app y abre otra vez esta página.', 'Ir a la app');
  if (r.status === 403) return mensaje('Página privada', 'Este centro de control es solo para las socias de TuCloset.', 'Ir a la app');
  if (!r.ok) return mensaje('Algo ha fallado', `El servidor ha respondido ${r.status}. Prueba otra vez en un momento.`);
  const d = await r.json(), P = d.panel || {};

  // ── utilidades ──
  const EST = { hecho: 'Hecho', marcha: 'En marcha', falta: 'Falta', espera: 'Espera', ok: 'Funciona', medio: 'A medias' };
  const est = e => `<span class="e ${esc(e)}" title="${EST[e] || esc(e)}"><span class="vh">${EST[e] || esc(e)}: </span></span>`;
  const fecha = iso => iso ? new Date(iso).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' }) : '—';
  const hora = iso => new Date(iso).toLocaleString('es-ES', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const n0 = n => (+n || 0).toLocaleString('es-ES', { useGrouping: 'always' });
  const dec = n => (Math.round(n * 100) / 100).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const usd = n => dec(n) + ' $', eur = n => n0(n) + ' €', eur2 = n => dec(n) + ' €';
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const hoy = new Date(), dia = n => new Date(hoy - n * 864e5).toISOString().slice(0, 10);
  const suma = (lista, f) => (lista || []).filter(f).reduce((s, x) => s + (+x.v || 0), 0);
  const tile = (valor, etiqueta, extra = '') => `<div class="tile"><b>${valor}</b><span>${etiqueta}</span>${extra}</div>`;
  const medidor = (v, tope, izq, der) => { const p = Math.min(100, pct(v, tope)); return `<div class="medidor" role="img" aria-label="${esc(izq)}: ${p} % del tope"><div class="pista"><i${p >= 80 ? ' class="alto"' : ''} style="width:${p}%"></i></div>${izq || der ? `<p><span>${esc(izq)}</span><span>${esc(der)}</span></p>` : ''}</div>`; };
  const bloque = (titulo, html, extra = '') => `<div class="bloque"><div class="tit"><h3>${titulo}</h3>${extra ? `<small>${extra}</small>` : ''}</div>${html}</div>`;

  // gráfico de línea: una serie, punto final marcado, el valor de cada día al pasar o con el teclado y, sin ratón, en la tabla
  const linea = (vals, etqs, nombre, unidad) => {
    const m = Math.max(1, ...vals), top = Math.ceil(m / (m > 4 ? 2 : 1)) * (m > 4 ? 2 : 1), n = vals.length;
    const X = i => n === 1 ? 50 : i / (n - 1) * 100, Y = v => 100 - v / top * 100;
    const pts = vals.map((v, i) => `${X(i).toFixed(2)},${Y(v).toFixed(2)}`).join(' ');
    const iMax = vals.indexOf(Math.max(...vals)); // el máximo solo se etiqueta si no está pegado al final
    return `<figure class="graf"><div class="plot" role="img" aria-label="${esc(nombre)}: ${vals.join(', ')}">
      ${[top, top / 2, 0].map(v => `<div class="rej" style="top:${Y(v)}%"><span>${n0(v)}</span></div>`).join('')}

    <div class="tiles">
      ${cifraR(semU ? sumaMed(semU, 'visualizaciones') : null, 'visualizaciones, última semana', semA ? sumaMed(semA, 'visualizaciones') : null)}
      ${cifraR(intSem(semU), 'guardados y compartidos por cada 1.000', intSem(semA))}
      ${cifraR(visDe(0, 6, o => ROJ.test(o)), 'visitas a la web desde las redes, 7 días', visDe(7, 13, o => ROJ.test(o)))}
      ${cifraR(altas7, 'apuntadas a la lista, 7 días', altasA)}
    </div>
    ${bloque('Por red', `<div class="desliza"><table class="tabla red"><thead><tr><th scope="col">Red</th><th scope="col" class="num">Seguidores</th><th scope="col" class="num">Vistas</th><th scope="col" class="num">Guardados</th><th scope="col" class="num">Clics</th><th scope="col" class="num">Web</th></tr></thead>
      <tbody>${REDES.map(([r, n]) => { const sg = segDe(r); return `<tr><th scope="row">${est(cuentaDe(n).e || 'falta')}${n}</th>${celda(sg ? num(sg.seguidores) : null)}${celda(semU ? sumaMed(semU, 'visualizaciones', r) : null)}${celda(semU ? sumaMed(semU, 'guardados', r) : null)}${celda(semU ? sumaMed(semU, 'clics_enlace', r) : null)}${celda(visDe(0, 29, o => o === r || o.startsWith(r + '-')))}</tr>`; }).join('')}</tbody></table></div>`,
      semU ? `semana ${esc(semU.slice(6))} · web: visitas en 30 días` : 'primera medición: viernes 13/11')}
    ${piezas.length ? bloque('Lo que mejor funcionó', hbarras(piezas.map(x => ({ n: (REDES.find(r => r[0] === x.red) || [, x.red])[1] + ' · ' + x.pieza, v: x.i, t: (Math.round(x.i * 10) / 10).toLocaleString('es-ES') }))), 'por 1.000 vistas') : ''}
    ${Object.keys(otras).length ? bloque('Otras visitas', hbarras(Object.entries(otras).sort((a, b) => b[1] - a[1]).map(([o, n]) => ({ n: nomRed(o), v: n }))), '30 días') : ''}
  </section>

  <section id="empresa"><h2 class="vh">Empresa</h2>
    <div class="heroe"><b>${cuenta('hecho')}<small>de ${F.length}</small></b><span>funciones de la app hechas</span></div>
    <div class="apilada" role="img" aria-label="Funciones: ${ESTADOS.map(e => cuenta(e) + ' ' + EST[e].toLowerCase()).join(', ')}">${ESTADOS.filter(cuenta).map(e => `<i class="${e}" style="flex:${cuenta(e)}" tabindex="0" data-tip="${EST[e]}" data-val="${cuenta(e)} funciones"></i>`).join('')}</div>
    <div class="leyenda">${ESTADOS.map(e => `<span>${est(e)}${EST[e]} <b>${cuenta(e)}</b></span>`).join('')}</div>
    ${bloque('Funciones', `<div class="plegables">${grupos.map(g => { const fs = F.filter(f => f.g === g); return plegable(g, fs.filter(f => f.e === 'hecho').length, fs.length, listaEst(fs.map(f => ({ e: f.e, t: f.f })))); }).join('')}</div>`, 'por pantalla')}
    ${bloque('Fases', `<ul class="fases">${(P.fases || []).map(f => `<li><span class="nom">${esc(f.n)}<small>${esc(f.i.slice(0, 5))}–${esc(f.f.slice(0, 5))}</small></span><span class="eur">${eur(f.m)}</span><span class="pista" role="img" aria-label="${esc(f.n)}: ${Math.round(f.a * 100)} %"><i style="width:${Math.round(f.a * 100)}%"></i></span></li>`).join('')}</ul>`,
      P.presupuesto ? `${eur(P.presupuesto.total)} hasta oct. 2027` : '')}
    ${bloque('Equipo', `<div class="plegables">${(P.departamentos || []).map(x => plegable(x.n, x.tareas.filter(t => t.e === 'hecho').length, x.tareas.length, listaEst(x.tareas))).join('')}
      ${(P.legal || []).length ? plegable('Legal y riesgos', P.legal.filter(x => x.e === 'hecho').length, P.legal.length, listaEst(P.legal)) : ''}</div>`)}
    ${bloque('Cuentas', `<ul class="cuentas">${(P.cuentas || []).map(x => `<li>${est(x.e)}<span>${esc(x.s)}</span>${/^https:\/\//.test(x.u || '') ? `<a href="${esc(x.u)}" target="_blank" rel="noopener">Abrir</a>` : '<span></span>'}</li>`).join('')}</ul>`, esc(P.nota_claves || ''))}
    ${bloque('Documentos', `<div class="plegables sin-barra">${(P.docs || []).map(x => `<details><summary><span class="nom">${esc(x.t)}</span><span class="cu">${esc((x.n || '').replace(/^.*?, /, '').slice(0, 5))}</span></summary><div class="cuerpo">${x.html}</div></details>`).join('')}</div>`)}
  </section>
  <p class="pie">Actualizado ${hora(d.generado)}</p>
  </main>`;

  // una sección cada vez, como pestañas; los enlaces viejos (#toca, #funciones…) llevan a la suya
  const VIEJAS = { toca: 'hoy', usuarias: 'cifras', funciones: 'empresa', fases: 'empresa', equipo: 'empresa', cuentas: 'empresa', mas: 'empresa' };
  const mostrar = () => { let k = location.hash.slice(1); k = VIEJAS[k] || k; const ok = secciones.some(([s]) => s === k) ? k : 'hoy';
    raiz.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== ok);
    raiz.querySelectorAll('nav a').forEach(a => a.getAttribute('href') === '#' + ok ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    window.scrollTo(0, 0); };
  addEventListener('hashchange', mostrar); mostrar();
  raiz.addEventListener('click', e => { const b = e.target.closest('[data-csv]'); if (b) CSV[b.dataset.csv](); });

  // el valor de cada punto o barra al pasar el ratón o con el teclado (también está en la tabla o en la etiqueta)
  const tip = document.getElementById('tip');
  const ver = el => { tip.replaceChildren(); const b = document.createElement('b'); b.textContent = el.dataset.val || ''; tip.append(b, document.createTextNode(el.dataset.tip || ''));
    const r = el.getBoundingClientRect(); tip.style.opacity = 1; const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px'; tip.style.top = Math.max(8, r.top - h - 8) + 'px'; };
  const quitar = () => { tip.style.opacity = 0; };
  raiz.addEventListener('pointerover', e => { const el = e.target.closest('[data-val]'); if (el) ver(el); });
  raiz.addEventListener('pointerout', e => { if (e.target.closest('[data-val]')) quitar(); });
  raiz.addEventListener('focusin', e => { const el = e.target.closest('[data-val]'); el ? ver(el) : quitar(); });
  raiz.addEventListener('focusout', quitar);
  addEventListener('scroll', quitar, { passive: true });
})();
</script>
</body>
</html>
