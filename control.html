<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#FFFFFF">
<title>Centro de control · TuCloset</title>
<link rel="icon" href="iconos/icono-129-180.png">
<link rel="stylesheet" href="fuentes.css?v=0.123">
<!-- 04/11/2026 (Gabriela: «un sistema de control de la empresa… donde sepamos el estado de todo, de la empresa, de las cuentas, de los suscriptores, de las estadísticas de uso, de fallos»).
     Solo para las socias: los datos llegan de /api/control con su sesión de la app; esta página no lleva ningún dato dentro.
     04/11, 23:5x (Gabriela: «hazlo más visible y con menos texto, así es horrible leerlo»): tarjetas, números grandes y barras; el detalle, plegado en «Más».
     05/11, 00:0x (Gabriela: «separa las secciones… si doy arriba en Funciones que vea solo las funciones… si no es mucha información y me aturde»): una sección cada vez. -->
<style>
:root { --tinta: #4A3526; --gris: #74655A; --oro: #C9A24B; --raya: #E6DFD8; --suave: #F7F4F1; --blanco: #FFFFFF; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--blanco); color: var(--tinta); font: 400 16px/1.45 'Jost', system-ui, sans-serif; }
a { color: inherit; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; }

.cab { text-align: center; padding: 28px 16px 6px; }
.cab img { width: 36px; height: 36px; display: block; margin: 0 auto 8px; }
.marca { font: 400 28px/1 'Bellefair', serif; margin: 0; }
.marca span { color: var(--oro); }
.cab p { margin: 4px 0 0; color: var(--gris); font-size: 14px; }

nav { position: sticky; top: 0; z-index: 2; background: var(--blanco); border-bottom: 1px solid var(--raya); overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav ul { display: flex; gap: 2px; justify-content: safe center; margin: 0; padding: 0 12px; list-style: none; min-width: max-content; }
nav a { display: block; padding: 12px 12px; min-height: 44px; font-size: 15px; text-decoration: none; color: var(--gris); }
nav a:hover, nav a:focus-visible { color: var(--tinta); }
nav a[aria-current] { color: var(--tinta); box-shadow: inset 0 -2px 0 var(--tinta); }

main { max-width: 1120px; margin: 0 auto; padding: 0 16px 64px; }
section { padding-top: 44px; scroll-margin-top: 52px; }
h2 { font: 400 30px/1.15 'Bellefair', serif; text-align: center; margin: 0 0 20px; }
h3 { font: 400 21px/1.2 'Bellefair', serif; margin: 0; }
.rejilla { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.tarjeta { background: var(--suave); padding: 18px; }

/* estado: un cuadrado, como los botones de la app */
.e { display: inline-block; width: 12px; height: 12px; flex: none; border: 1.5px solid var(--tinta); vertical-align: -1px; }
.e.hecho, .e.ok { background: var(--tinta); }
.e.marcha, .e.medio { background: linear-gradient(90deg, var(--tinta) 50%, transparent 50%); }
.e.espera { border-style: dashed; }
.leyenda { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 20px; font-size: 14px; color: var(--gris); margin: -8px 0 22px; }
.leyenda span { display: inline-flex; align-items: center; gap: 7px; }

/* os toca */
.toca .tarjeta { display: flex; flex-direction: column; gap: 6px; }
@media (min-width: 640px) { .toca .tarjeta { min-height: 120px; } }
.quien { font-size: 13px; letter-spacing: .06em; color: var(--gris); }
.toca b { font: 400 22px/1.2 'Bellefair', serif; }
.toca .rec { margin-top: auto; font-size: 14px; color: var(--gris); }

/* cifras */
.cifras { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.cifras div { background: var(--suave); text-align: center; padding: 20px 8px; }
.cifras b { display: block; font: 400 48px/1 'Bellefair', serif; }
.cifras span { display: block; margin-top: 6px; font-size: 14px; color: var(--gris); }
@media (min-width: 760px) { .cifras { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.uso { margin-top: 12px; padding: 18px 18px 12px; }
.uso p { margin: 0 0 6px; text-align: center; font-size: 14px; color: var(--gris); }
.redes { margin-top: 12px; }
.redes p { margin: 0 0 8px; text-align: center; font-size: 14px; color: var(--gris); }
.redes table { width: 100%; border-collapse: collapse; font-size: 15px; }
.redes th, .redes td { padding: 8px 4px; border-top: 1px solid var(--raya); text-align: right; font-weight: 400; }
.redes thead th { border-top: 0; font-size: 13px; color: var(--gris); }
.redes th:first-child { text-align: left; }
.redes td { font-variant-numeric: tabular-nums; }
.redes .vacio { display: block; text-align: center; font-size: 14px; color: var(--gris); }
.barras { display: flex; align-items: flex-end; gap: 6px; height: 120px; }
.barras div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
.barras i { display: block; width: 100%; max-width: 32px; background: var(--tinta); min-height: 1px; }
.barras small { font-size: 12px; color: var(--gris); }
.barras em { font-style: normal; font-size: 13px; }

/* para mirar */
.mirar a, .mirar div { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 4px; min-height: 96px; text-decoration: none; }
.mirar a { border: 1px solid var(--tinta); background: var(--blanco); }
.mirar a:hover { background: var(--suave); }
.mirar b { font: 400 21px/1.2 'Bellefair', serif; }
.mirar span { font-size: 14px; color: var(--gris); }

/* avance de funciones */
.grande { text-align: center; margin: 0 auto 26px; max-width: 420px; }
.grande b { font: 400 56px/1 'Bellefair', serif; }
.grande span { font-size: 16px; color: var(--gris); }
.barra { height: 8px; background: var(--raya); margin-top: 12px; }
.barra i { display: block; height: 100%; background: var(--tinta); }
.tarjeta .barra { height: 6px; margin: 10px 0 14px; background: var(--blanco); }
.lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.lista li { display: grid; grid-template-columns: 12px 1fr; gap: 10px; align-items: start; font-size: 15px; line-height: 1.3; }
.lista li .e { margin-top: 3px; }
.cabeza { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.cabeza small { font-size: 14px; color: var(--gris); white-space: nowrap; }

/* fases */
.fases { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 640px) { .fases { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .fases { grid-template-columns: repeat(7, minmax(0, 1fr)); } }
.fases .tarjeta { text-align: center; padding: 16px 12px; }
.fases .eur { display: block; font: 400 30px/1.1 'Bellefair', serif; margin: 8px 0 2px; }
.fases small { display: block; font-size: 13px; color: var(--gris); }
.fases .barra { margin: 12px 0 0; }
.total { text-align: center; margin: 26px 0 0; }
.total b { display: block; font: 400 48px/1 'Bellefair', serif; }
.total span { font-size: 15px; color: var(--gris); }
.fechas { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-top: 28px; }
.fechas div { border-top: 2px solid var(--tinta); padding-top: 10px; text-align: center; }
.fechas b { display: block; font: 400 26px/1.1 'Bellefair', serif; }
.fechas span { font-size: 14px; color: var(--gris); }

/* cuentas */
.cuentas .tarjeta { display: grid; grid-template-columns: 12px 1fr; gap: 4px 10px; align-items: start; padding: 14px 16px; }
.cuentas .tarjeta .e { margin-top: 5px; }
.cuentas b { font-weight: 500; font-size: 15px; }
.cuentas span.p { grid-column: 2; font-size: 14px; color: var(--gris); }
.cuentas a.abrir { grid-column: 2; justify-self: start; display: inline-flex; align-items: center; min-height: 44px; font-size: 15px; color: var(--tinta); text-decoration: underline; text-underline-offset: 3px; }
.nota { text-align: center; font-size: 14px; color: var(--gris); margin: 14px 0 0; }

/* más: todo plegado */
.mas details { border-top: 1px solid var(--raya); }
.mas details:last-of-type { border-bottom: 1px solid var(--raya); }
.mas summary { list-style: none; cursor: pointer; padding: 16px 32px 16px 0; position: relative; min-height: 44px; font: 400 21px/1.2 'Bellefair', serif; }
.mas summary::-webkit-details-marker { display: none; }
.mas summary::after { content: '+'; position: absolute; right: 6px; top: 14px; font: 400 24px/1 'Jost', sans-serif; }
.mas details[open] summary::after { content: '–'; }
.mas summary h3 { font: inherit; display: inline; }
.mas summary small { font: 400 14px 'Jost', sans-serif; color: var(--gris); margin-left: 8px; }
.cuerpo { padding: 0 0 24px; font-size: 15px; }
.cuerpo h4 { font: 400 19px/1.3 'Bellefair', serif; margin: 22px 0 6px; }
.cuerpo p, .cuerpo li { max-width: 70ch; }
.cuerpo ul, .cuerpo ol { padding-left: 20px; margin: 6px 0 12px; }
.cuerpo table, .tabla { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0 14px; }
.cuerpo td, .cuerpo th, .tabla td, .tabla th { border-bottom: 1px solid var(--raya); padding: 8px 6px; text-align: left; vertical-align: top; font-weight: 400; }
.cuerpo th, .tabla th { color: var(--gris); font-size: 12px; }
.tabla .num { text-align: right; font-variant-numeric: tabular-nums; }
.desliza { overflow-x: auto; }
.filas { list-style: none; margin: 0; padding: 0; }
.filas li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--raya); font-size: 15px; }
.filas code { font: 12px/1.4 ui-monospace, Menlo, monospace; word-break: break-word; }
.filas li span:last-child { white-space: nowrap; color: var(--gris); font-size: 14px; }
.grupo { font: 400 18px/1.3 'Bellefair', serif; margin: 18px 0 4px; }

.vacio, .aviso { text-align: center; color: var(--gris); font-size: 15px; margin: 8px 0; }
.mensaje { max-width: 34ch; margin: 80px auto; text-align: center; padding: 0 16px; }
.mensaje p { color: var(--gris); }
.boton { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 22px; margin-top: 18px; border: 1px solid var(--tinta); text-decoration: none; letter-spacing: .08em; font-size: 14px; }
.pie { text-align: center; color: var(--gris); font-size: 13px; margin-top: 40px; }

/* 09/11: volver a la app (se entra desde Ajustes → Centro de control) */
.cab { position: relative; }
.volver { position: absolute; left: 8px; top: 12px; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 8px; font-size: 14px; text-decoration: none; color: var(--gris); }
.volver svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; }
.volver:hover { color: var(--tinta); }

/* 09/11: usuarias y dinero (Gabriela: «cuántos usuarios tienen, el uso de cada usuario y todos los datos que nos sirvan para llevar una contabilidad») */
.cifras.c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 760px) { .cifras.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.cifras.c3, .redes .cifras.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 8px; }
.redes .cifras div { background: var(--blanco); padding: 14px 4px; }
.redes .cifras b { font-size: 36px; }
.ficha .correo { word-break: break-all; }
.ficha .cuando { margin: 4px 0 12px; font-size: 14px; color: var(--gris); }
.nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 0; }
.nums div { display: flex; flex-direction: column-reverse; align-items: center; text-align: center; background: var(--blanco); padding: 10px 4px; }
.nums dt { font-size: 12px; line-height: 1.25; color: var(--gris); }
.nums dd { margin: 0 0 4px; font: 400 26px/1 'Bellefair', serif; font-variant-numeric: tabular-nums; }
.mes .filas li span:first-child { color: var(--tinta); }
.mes .filas li.tot { border-bottom: 0; font-weight: 500; }
.mes .filas li.tot span:last-child { color: var(--tinta); font-size: 15px; }
.acciones { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 12px; }
button.boton { background: var(--blanco); color: var(--tinta); font: inherit; font-size: 14px; letter-spacing: .08em; cursor: pointer; }
button.boton:hover { background: var(--suave); }
</style>
</head>
<body>
<header class="cab">
  <a class="volver" href="./"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>Volver a la app</a>
  <img src="iconos/icono-129-180.png" alt="">
  <h1 class="marca">Tu<span>Closet</span></h1>
  <p>Centro de control</p>
</header>
<div id="raiz"><p class="aviso" style="margin-top:40px">Cargando…</p></div>
<script>
(async () => {
  const raiz = document.getElementById('raiz');
  const API = (() => { try { const q = localStorage.getItem('tc_api'); if (q) return q; } catch (e) { } return /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://localhost:8787' : 'https://tucloset-api.apptucloset.workers.dev'; })();
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const mensaje = (tit, txt, boton) => { raiz.innerHTML = `<div class="mensaje"><h2>${tit}</h2><p>${txt}</p>${boton ? `<a class="boton" href="./">${boton}</a>` : ''}</div>`; };
  let c = null; try { c = JSON.parse(localStorage.getItem('tc_cuenta') || 'null'); } catch (e) { }
  if (!c?.token) return mensaje('Entra primero', 'Abre tu cuenta en la app y vuelve a esta página.', 'Ir a la app');
  let r; try { r = await fetch(API + '/api/control', { headers: { Authorization: 'Bearer ' + c.token } }); } catch (e) { return mensaje('Sin conexión', 'No he podido hablar con el servidor. Prueba otra vez en un momento.'); }
  if (r.status === 401) return mensaje('Tu sesión ha caducado', 'Vuelve a entrar en la app y abre otra vez esta página.', 'Ir a la app');
  if (r.status === 403) return mensaje('Página privada', 'Este centro de control es solo para las socias de TuCloset.', 'Ir a la app');
  if (!r.ok) return mensaje('Algo ha fallado', `El servidor ha respondido ${r.status}. Prueba otra vez en un momento.`);
  const d = await r.json(), P = d.panel || {};
  const EST = { hecho: 'Hecho', marcha: 'En marcha', falta: 'Falta', espera: 'Espera', ok: 'Funciona', medio: 'A medias' };
  const est = e => `<span class="e ${esc(e)}" title="${EST[e] || esc(e)}"><span class="vh">${EST[e] || esc(e)}: </span></span>`;
  const fecha = iso => iso ? new Date(iso).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' }) : '—';
  const hora = iso => new Date(iso).toLocaleString('es-ES', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const eur = n => (+n).toLocaleString('es-ES', { useGrouping: 'always' }) + ' €';
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const barra = p => `<div class="barra" aria-hidden="true"><i style="width:${p}%"></i></div>`;
  const hoy = new Date(), dia = n => new Date(hoy - n * 864e5).toISOString().slice(0, 10);
  const activas7 = new Set(d.uso.filter(u => u.dia >= dia(6)).map(u => u.usuaria)).size;
  const fallos7 = d.avisos.filter(a => a.fecha >= new Date(hoy - 7 * 864e5).toISOString()).length;
  const prendas = d.usuarias.reduce((s, u) => s + u.prendas, 0);
  const secciones = [['toca', 'Os toca'], ['cifras', 'Cifras'], ['usuarias', 'Usuarias'], ['dinero', 'Dinero'], ['funciones', 'Funciones'], ['fases', 'Fases'], ['equipo', 'Equipo'], ['cuentas', 'Cuentas'], ['mas', 'Más']];

  // personas que abrieron la app cada día, últimos 14 días
  const dias = [...Array(14)].map((_, i) => dia(13 - i)), porDia = dias.map(k => new Set(d.uso.filter(u => u.dia === k).map(u => u.usuaria)).size), max = Math.max(1, ...porDia);
  // 09/11: visitas que llegan desde cada red (?o=) y cuentas creadas en esa visita, últimos 30 días
  const RED = { ig: 'Instagram', tt: 'TikTok', pin: 'Pinterest', g: 'Google', cartel: 'Cartel' }, nomRed = o => RED[o] || (/^mail/.test(o) ? 'Correo ' + o.slice(4) : /-ad\d+$/.test(o) ? 'Anuncio ' + o : o);
  const vis = {}; (d.visitas || []).filter(v => v.dia >= dia(29)).forEach(v => { const x = vis[v.origen] = vis[v.origen] || { n: 0, a: 0 }; x.n += v.n; x.a += v.altas; });
  const filasRed = Object.entries(vis).sort((a, b) => b[1].n - a[1].n);
  const redes = `<div class="tarjeta redes"><p>Visitas desde las redes, 30 días</p>${filasRed.length ? `<table><thead><tr><th scope="col">Red</th><th scope="col">Visitas</th><th scope="col">Cuentas nuevas</th></tr></thead><tbody>${filasRed.map(([o, x]) => `<tr><th scope="row">${esc(nomRed(o))}</th><td>${x.n}</td><td>${x.a}</td></tr>`).join('')}</tbody></table>` : '<span class="vacio">Todavía ninguna. Cuentan los enlaces con ?o=ig, ?o=tt o ?o=pin.</span>'}</div>`;
  // 10/11: lista de espera (apuntadas = pidieron entrar; confirmadas = abrieron el correo de confirmación, según Brevo)
  const E = d.espera || { abierta: false, confirmadas: null, filas: [] }, EF = E.filas || [];
  const esOr = {}; EF.forEach(x => { const k = x.origen || ''; esOr[k] = (esOr[k] || 0) + 1; });
  const filasEs = Object.entries(esOr).sort((a, b) => b[1] - a[1]);
  const espera = `<div class="tarjeta redes"><p>Lista de espera</p>${!E.abierta && !EF.length ? '<span class="vacio">Cerrada hasta tener Brevo y la privacidad publicada.</span>'
    : `<div class="cifras c3"><div><b>${EF.length}</b><span>apuntadas</span></div><div><b>${E.confirmadas ?? '—'}</b><span>confirmadas</span></div><div><b>${EF.filter(x => x.dia >= dia(6)).length}</b><span>esta semana</span></div></div>${filasEs.length ? `<table><thead><tr><th scope="col">Desde</th><th scope="col">Apuntadas</th></tr></thead><tbody>${filasEs.map(([o, n]) => `<tr><th scope="row">${esc(o ? nomRed(o) : 'Directo')}</th><td>${n}</td></tr>`).join('')}</tbody></table>` : ''}<span class="vacio">Novedades: ${EF.filter(x => x.nov).length} de ${EF.length}.</span>`}</div>`;
  const barras = `<div class="barras" role="img" aria-label="Personas que abrieron la app cada día, últimos 14 días: ${porDia.join(', ')}">${dias.map((k, i) => `<div><em>${porDia[i] || ''}</em><i style="height:${Math.round(porDia[i] / max * 80)}%"></i><small>${+k.slice(8)}</small></div>`).join('')}</div>`;

  // 09/11: usuarias (ficha de cada una) y dinero (contabilidad por mes), con descarga en CSV para Excel
  const usd = n => (Math.round(n * 100) / 100).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' $';
  const suma = (lista, f) => (lista || []).filter(f).reduce((s, x) => s + (+x.v || 0), 0);
  const G = (d.gasto || []).map(g => ({ ...g, v: g.c })), GN = (d.gasto || []).map(g => ({ ...g, v: g.ok }));
  const R = (d.recortes || []).map(x => ({ ...x, v: x.n })), I = (d.inspos || []).map(x => ({ ...x, v: x.n }));
  const UT = Object.fromEntries((d.usoTotal || []).map(x => [x.usuaria, x]));
  const VE = { gratis: 'Gratis', basico: 'Básico', pro: 'Pro' };
  const fichas = d.usuarias.map(u => { const x = UT[u.id] || {}, ult = [x.ultimo, (u.actualizado || '').slice(0, 10)].filter(Boolean).sort().pop() || null;
    return { ...u, ultimo: ult, dias30: x.dias30 || 0, dias: x.dias || 0, usd: suma(G, g => g.usuaria === u.id),
      cat: suma(GN, g => g.usuaria === u.id && g.s === 'catalogo'), av: suma(GN, g => g.usuaria === u.id && g.s === 'avatar'), pu: suma(GN, g => g.usuaria === u.id && g.s === 'puesto'),
      rec: suma(R, g => g.usuaria === u.id), ins: suma(I, g => g.usuaria === u.id) }; })
    .sort((a, b) => (b.ultimo || '').localeCompare(a.ultimo || '') || (b.creada || '').localeCompare(a.creada || ''));
  const socias = new Set(fichas.filter(u => u.socia).map(u => u.id));
  const act = (n, sinSocias) => new Set(d.uso.filter(u => u.dia >= dia(n - 1) && !(sinSocias && socias.has(u.usuaria))).map(u => u.usuaria)).size;
  const nuevas7 = d.usuarias.filter(u => u.creada >= new Date(hoy - 7 * 864e5).toISOString()).length;
  const lunes = x => { x = new Date(x); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
  const semanas = [...Array(8)].map((_, i) => { const l = lunes(hoy); l.setDate(l.getDate() - 7 * (7 - i)); return l; });
  const altasSem = semanas.map((l, i) => d.usuarias.filter(u => { const c = new Date(u.creada); return c >= l && (i === 7 || c < semanas[i + 1]); }).length);
  const barrasDe = (vals, etq, aria) => { const m = Math.max(1, ...vals); return `<div class="barras" role="img" aria-label="${aria}: ${vals.join(', ')}">${vals.map((v, i) => `<div><em>${v || ''}</em><i style="height:${Math.round(v / m * 80)}%"></i><small>${etq[i]}</small></div>`).join('')}</div>`; };
  const ficha = u => `<div class="tarjeta ficha"><div class="cabeza"><h3 class="correo">${esc(u.correo)}</h3><small>${[u.socia ? 'Socia' : '', VE[u.ve] || ''].filter(Boolean).join(' · ')}</small></div>
    <p class="cuando">Alta ${fecha(u.creada)} · último día ${fecha(u.ultimo)}</p>
    <dl class="nums"><div><dt>días de uso, 30 días</dt><dd>${u.dias30}</dd></div><div><dt>prendas</dt><dd>${u.prendas}</dd></div><div><dt>looks</dt><dd>${u.looks}</dd></div><div><dt>gasto de IA</dt><dd>${u.usd ? usd(u.usd).replace(' $', '') : '0'}<small style="font-size:14px"> $</small></dd></div></dl></div>`;
  // dinero: cada mes con lo que se ha pedido a la IA (servidor) y las tandas de la Dirección desde el Mac (panel)
  const DIR = Object.fromEntries((P.iaDireccion || []).map(x => [x.mes, x.usd]));
  const meses = [...new Set([...(d.gasto || []), ...(d.recortes || []), ...(d.inspos || [])].map(x => x.mes).concat(Object.keys(DIR)))].sort().reverse().slice(0, 12);
  const mesAhora = new Date().toISOString().slice(0, 7);
  const nomMes = m => { const s = new Date(m + '-15').toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }); return s[0].toUpperCase() + s.slice(1); };
  const iaMes = (m, sinSocias) => suma(G, g => g.mes === m && !(sinSocias && socias.has(g.usuaria))) + (sinSocias ? 0 : DIR[m] || 0);
  const porActiva = act(30, true) ? usd(iaMes(mesAhora, true) / act(30, true)) : '—';
  const fijosTot = (P.fijos || []).reduce((s, [, v]) => s + v, 0);
  const mesCard = m => { const n = s => suma(GN, g => g.mes === m && g.s === s), c = s => suma(G, g => g.mes === m && g.s === s);
    const fila = (t, v) => `<li><span>${t}</span><span>${v}</span></li>`;
    return `<div class="tarjeta mes"><h3>${nomMes(m)}</h3><ul class="filas">
      ${fila('Fotos de catálogo', `${n('catalogo')} · ${usd(c('catalogo'))}`)}${fila('Avatares', `${n('avatar')} · ${usd(c('avatar'))}`)}${fila('Puesto en mí', `${n('puesto')} · ${usd(c('puesto'))}`)}
      ${DIR[m] ? fila('Tandas de la Dirección', usd(DIR[m])) : ''}${fila('Recortes de fondo', `${suma(R, x => x.mes === m)} · gratis`)}${fila('Lecturas de looks', `${suma(I, x => x.mes === m)} · gratis`)}
      <li class="tot"><span>Total de IA</span><span>${usd(iaMes(m))}</span></li></ul></div>`; };
  const csv = (nombre, filas) => { const txt = '\ufeff' + filas.map(f => f.map(v => { const x = typeof v === 'number' ? String(Math.round(v * 1000) / 1000).replace('.', ',') : String(v ?? '');
      return /[;"\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }).join(';')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' })); a.download = nombre; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); };
  const CSV = {
    usuarias: () => csv('tucloset-usuarias.csv', [['Cuenta', 'Socia', 'Alta', 'Último día', 'Días de uso (30 días)', 'Días de uso (total)', 'Prendas', 'Con foto de catálogo', 'Looks', 'Puestas', 'Versión que ve', 'Ropa', 'Diagnóstico', 'Fotos de catálogo IA', 'Avatares', 'Puesto en mí', 'Recortes', 'Lecturas de looks', 'Gasto de IA ($)'],
      ...fichas.map(u => [u.correo, u.socia ? 'sí' : 'no', (u.creada || '').slice(0, 10), u.ultimo || '', u.dias30, u.dias, u.prendas, u.catalogo, u.looks, u.usos, VE[u.ve] || '', u.ropa || '', u.diag ? 'sí' : 'no', u.cat, u.av, u.pu, u.rec, u.ins, u.usd])]),
    dinero: () => csv('tucloset-contabilidad.csv', [['Mes', 'Concepto', 'Cantidad', 'Dólares', 'Euros'],
      ...meses.slice().reverse().flatMap(m => [[m, 'Ingresos', 0, '', 0],
        ...['catalogo', 'avatar', 'puesto'].map(s => [m, { catalogo: 'Fotos de catálogo', avatar: 'Avatares', puesto: 'Puesto en mí' }[s], suma(GN, g => g.mes === m && g.s === s), suma(G, g => g.mes === m && g.s === s), '']),
        [m, 'Tandas de la Dirección (IA)', '', DIR[m] || 0, ''], [m, 'Recortes de fondo (gratis)', suma(R, x => x.mes === m), 0, ''], [m, 'Lecturas de looks (gratis)', suma(I, x => x.mes === m), 0, '']]),
      ...(P.fijos || []).map(([n, v]) => ['al mes', 'Fijo previsto: ' + n, '', '', v])]),
    uso: () => { const k = [...new Set(d.uso.map(u => u.dia))].sort(); csv('tucloset-uso-por-dia.csv', [['Día', 'Personas', 'Personas sin vosotras', 'Aperturas'], ...k.map(x => { const u = d.uso.filter(y => y.dia === x); return [x, u.length, u.filter(y => !socias.has(y.usuaria)).length, u.reduce((s, y) => s + y.n, 0)]; })]); } };

  let enc = '<p class="vacio">Aún no hay respuestas.</p>';
  if (d.encuestas.length) { const cuenta = {}; d.encuestas.forEach(x => Object.entries(x.r).forEach(([q, v]) => { (cuenta[q] = cuenta[q] || {}); [].concat(v).forEach(o => cuenta[q][o] = (cuenta[q][o] || 0) + 1); }));
    enc = Object.entries(cuenta).map(([q, ops]) => `<h4 class="grupo">${esc(q)}</h4><ul class="filas">${Object.entries(ops).sort((a, b) => b[1] - a[1]).map(([o, n]) => `<li><span>${esc(o)}</span><span>${n}</span></li>`).join('')}</ul>`).join(''); }

  const F = P.funciones || [], grupos = [...new Set(F.map(f => f.g))], hechas = F.filter(f => f.e === 'hecho').length;
  const leyenda = `<div class="leyenda"><span>${est('hecho')}Hecho</span><span>${est('marcha')}En marcha</span><span>${est('falta')}Falta</span><span>${est('espera')}Espera</span></div>`;
  const mas = [
    ['Encuesta de las pruebas', d.encuestas.length ? `${d.encuestas.length}` : '', enc],
    ...(P.docs || []).map(x => [x.t, '', x.html]),
    ['Fallos', `${d.avisos.length}`, d.avisos.length ? `<ul class="filas">${d.avisos.slice(0, 20).map(a => `<li><code>${esc(a.d)}</code><span>${hora(a.fecha)}</span></li>`).join('')}</ul>` : '<p class="vacio">Ningún fallo.</p>'],
  ];

  raiz.innerHTML = `<nav aria-label="Secciones"><ul>${secciones.map(([k, n]) => `<li><a href="#${k}">${n}</a></li>`).join('')}</ul></nav><main>
  <section id="toca"><h2>Os toca</h2>
    <div class="rejilla toca">${(P.pendientes || []).map(p => `<div class="tarjeta"><span class="quien">${esc(p.q)}</span><b>${esc(p.t)}</b>${p.r ? `<span class="rec">${esc(p.r)}</span>` : ''}</div>`).join('')}</div></section>

  <section id="cifras"><h2>Cifras</h2>
    <div class="cifras"><div><b>${d.usuarias.length}</b><span>cuentas</span></div><div><b>${activas7}</b><span>activas, 7 días</span></div><div><b>${prendas}</b><span>prendas</span></div>
    <div><b>0</b><span>suscriptoras</span></div><div><b>${d.entradas7}</b><span>entradas, 7 días</span></div><div><b>${fallos7}</b><span>fallos, 7 días</span></div>${d.catalogoMes ? `<div><b>${d.catalogoMes.hechas}</b><span>fotos de catálogo este mes · ${String(d.catalogoMes.usd).replace(".", ",")} $ de ${d.catalogoMes.tope}</span></div>` : ""}</div>
    <div class="tarjeta uso"><p>Personas que abren la app cada día</p>${barras}</div>
    ${redes}
    ${espera}
    <div class="rejilla mirar" style="margin-top:12px">${(P.mirar || []).map(x => x.url ? `<a href="${esc(x.url)}"><b>${esc(x.t)}</b><span>${esc(x.n || '')}</span></a>` : `<div class="tarjeta"><b>${esc(x.t)}</b><span>${esc(x.n || '')}</span></div>`).join('')}</div></section>

  <section id="usuarias"><h2>Usuarias</h2>
    <div class="cifras c4"><div><b>${d.usuarias.length}</b><span>cuentas${socias.size ? `, ${socias.size} vuestras` : ''}</span></div><div><b>${act(7)}</b><span>activas, 7 días</span></div><div><b>${act(30)}</b><span>activas, 30 días</span></div><div><b>${nuevas7}</b><span>nuevas, 7 días</span></div></div>
    <div class="tarjeta uso"><p>Cuentas nuevas cada semana</p>${barrasDe(altasSem, semanas.map(l => `${l.getDate()}/${l.getMonth() + 1}`), 'Cuentas nuevas cada semana, últimas 8 semanas')}</div>
    <div class="rejilla" style="margin-top:12px">${fichas.map(ficha).join('')}</div>
    <p class="nota">Cada cuenta, con su correo abreviado. Vuestras pruebas y las de la Dirección cuentan como uso vuestro.</p>
    <div class="acciones"><button class="boton" type="button" data-csv="usuarias">Descargar usuarias (CSV)</button><button class="boton" type="button" data-csv="uso">Descargar uso por día (CSV)</button></div></section>

  <section id="dinero"><h2>Dinero</h2>
    <div class="cifras c4"><div><b>0 €</b><span>ingresos este mes</span></div><div><b>${usd(iaMes(mesAhora)).replace(' $', '')}<small style="font-size:24px"> $</small></b><span>IA este mes</span></div><div><b>${fijosTot} €</b><span>fijos previstos al mes</span></div><div><b>${porActiva.replace(' $', '')}${porActiva === '—' ? '' : '<small style="font-size:24px"> $</small>'}</b><span>IA por usuaria activa, sin vosotras</span></div></div>
    <div class="rejilla" style="margin-top:12px">${meses.length ? meses.map(mesCard).join('') : '<p class="vacio">Todavía no hay gastos.</p>'}
      <div class="tarjeta mes"><h3>Fijos previstos al mes</h3><ul class="filas">${(P.fijos || []).map(([n, v]) => `<li><span>${esc(n)}</span><span>${v} €</span></li>`).join('')}<li class="tot"><span>Total</span><span>${fijosTot} €</span></li></ul></div></div>
    <p class="nota">La IA se paga en dólares a Google. Los recortes y las lecturas de looks son gratis dentro del cupo de Cloudflare. Sin cobros todavía.</p>
    <div class="acciones"><button class="boton" type="button" data-csv="dinero">Descargar contabilidad (CSV)</button></div></section>

  <section id="funciones"><h2>Funciones de la app</h2>
    <div class="grande"><b>${hechas}</b><span> de ${F.length} hechas</span>${barra(pct(hechas, F.length))}</div>${leyenda}
    <div class="rejilla">${grupos.map(g => { const fs = F.filter(f => f.g === g), h = fs.filter(f => f.e === 'hecho').length; return `<div class="tarjeta"><div class="cabeza"><h3>${esc(g)}</h3><small>${h} de ${fs.length}</small></div>${barra(pct(h, fs.length))}<ul class="lista">${fs.map(f => `<li>${est(f.e)}<span>${esc(f.f)}</span></li>`).join('')}</ul></div>`; }).join('')}</div></section>

  <section id="fases"><h2>Fases y presupuesto</h2>
    <div class="fases">${(P.fases || []).map(f => `<div class="tarjeta"><h3>${esc(f.n)}</h3><span class="eur">${eur(f.m)}</span><small>${esc(f.i.slice(0, 5))} – ${esc(f.f.slice(0, 5))}</small>${barra(Math.round(f.a * 100))}<small style="margin-top:6px">${Math.round(f.a * 100)} %</small></div>`).join('')}</div>
    ${P.presupuesto ? `<div class="total"><b>${eur(P.presupuesto.total)}</b><span>hasta octubre de 2027 · ${P.presupuesto.antes} € antes de cobrar</span></div>` : ''}
    <div class="fechas">${(P.calendario || []).map(x => `<div><b>${esc(x.f.slice(0, 5))}</b><span>${esc(x.q.replace(/ \(propuesta\)$/, ''))}</span></div>`).join('')}</div></section>

  <section id="equipo"><h2>Equipo</h2>${leyenda}
    <div class="rejilla">${(P.departamentos || []).map(x => { const h = x.tareas.filter(t => t.e === 'hecho').length; return `<div class="tarjeta"><div class="cabeza"><h3>${esc(x.n)}</h3><small>${h} de ${x.tareas.length}</small></div>${barra(pct(h, x.tareas.length))}<ul class="lista">${x.tareas.map(tk => `<li>${est(tk.e)}<span>${esc(tk.t)}</span></li>`).join('')}</ul></div>`; }).join('')}</div></section>

  <section id="cuentas"><h2>Cuentas de la empresa</h2>
    <div class="rejilla cuentas">${(P.cuentas || []).map(x => `<div class="tarjeta">${est(x.e)}<b>${esc(x.s)}</b><span class="p">${esc(x.p)}</span>${/^https:\/\//.test(x.u || '') ? `<a class="abrir" href="${esc(x.u)}" target="_blank" rel="noopener">Abrir ${esc(x.s.split(' ')[0])}</a>` : ''}</div>`).join('')}</div>
    <p class="nota">${esc(P.nota_claves || '')}</p></section>

  <section id="mas" class="mas"><h2>Más</h2>
    ${mas.map(([t, n, html]) => `<details><summary><h3>${esc(t)}${n ? `<small>${esc(n)}</small>` : ''}</h3></summary><div class="cuerpo">${html}</div></details>`).join('')}</section>
  <p class="pie">Actualizado: ${hora(d.generado)}</p>
  </main>`;

  // una sección cada vez, como pestañas; el enlace (#funciones…) abre la suya
  const mostrar = () => { const k = location.hash.slice(1), ok = secciones.some(([s]) => s === k) ? k : 'toca';
    raiz.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== ok);
    raiz.querySelectorAll('nav a').forEach(a => a.getAttribute('href') === '#' + ok ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    window.scrollTo(0, 0); };
  addEventListener('hashchange', mostrar); mostrar();
  raiz.addEventListener('click', e => { const b = e.target.closest('[data-csv]'); if (b) CSV[b.dataset.csv](); });
})();
</script>
</body>
</html>
