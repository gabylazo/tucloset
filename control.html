/* Centro de control: estilo común de todos los proyectos (coordinación de marketing, 11/11/2026).
   Sale del Centro de control general de Gabriela (control/centro-de-control.plantilla.html), que es la referencia viva.
   Cada proyecto lo copia en su web (no se enlaza entre dominios), con Figtree alojada en su web en woff2 (nada de Google Fonts) y SOLO cambia el bloque «Marca» de :root y el logo.
   Siempre en modo claro. */
:root {
  color-scheme: light;
  /* Marca: lo único que cambia cada proyecto */
  --acento: #8C6A1F;        /* TuCloset: dorado oscuro (5,0:1 sobre blanco). 11/11, Gabriela eligió la opción 2 «Dorado de acento» (antes nogal: «el color marrón no me gusta») */
  --graf: #8F6A14;          /* gráficos, medidores y barras: el mismo dorado con algo más de croma (pasa el validador; 4,9:1) */
  --acento-tinta: #ffffff;
  --f-marca: 'Bellefair', Georgia, serif; /* solo en el logo */
  --oro: #C9A24B;           /* TuCloset: el dorado, solo en el logo (2,4:1: nunca en texto) */
  /* Común: no se toca */
  --bg: #ffffff; --ink: #0f1412; --ink-2: #4d5551; --ink-3: #6b7370; --line: #e6e9e7; --grid: #eff1f0; --soft: #f6f7f6;
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b; /* solo en puntos, barras y flechas, nunca en texto */
  --good-t: #0b7a0b;  /* verde para texto (5,5:1); el ámbar no va nunca en texto */
  --f-body: "Figtree", "Helvetica Neue", system-ui, sans-serif;
  --nav-h: 60px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* Página */
main { max-width: 1040px; margin: 0 auto; display: grid; gap: 14px; align-content: start; padding: 22px max(16px, env(safe-area-inset-right, 0px)) calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 28px) max(16px, env(safe-area-inset-left, 0px)); }
main > * { min-width: 0; }
.cc-top { display: flex; align-items: center; gap: 10px; }
.cc-top img { height: 28px; width: auto; }
.cc-top b { font-family: var(--f-marca); font-size: 1rem; font-weight: 700; }
.cc-top span { margin-left: auto; font-size: .72rem; color: var(--ink-3); }
.head h1 { font-size: 1.6rem; font-weight: 700; line-height: 1.1; margin: 0; letter-spacing: -0.02em; }
.label { font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.dash { display: grid; gap: 14px; }
@media (min-width: 900px) { .dash { grid-template-columns: repeat(2, minmax(0, 1fr)); } .dash .wide { grid-column: 1 / -1; } }

/* Tarjeta */
.card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.card > * { min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.card-h h2 { margin: 0; font-size: .98rem; font-weight: 700; }
.card-h .count { font-size: .8rem; font-weight: 600; color: var(--ink-3); margin-left: 6px; }
.more { color: var(--ink-2); font-weight: 600; font-size: .84rem; text-decoration: none; }

/* Lo siguiente: casilla de fecha + una línea */
.next { grid-template-columns: 68px minmax(0, 1fr); align-items: center; gap: 14px; border-color: var(--acento); }
.dtile { border: 1.5px solid var(--acento); border-radius: 14px; display: grid; justify-items: center; padding: 7px 0 8px; line-height: 1.05; }
.dtile small { font-size: .62rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.dtile b { font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.dtile span { font-size: .72rem; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 3px; }
.next-title { font-size: 1.06rem; font-weight: 600; line-height: 1.28; }
.rel { font-size: .7rem; font-weight: 700; color: var(--acento-tinta); background: var(--acento); padding: 1px 8px; border-radius: 99px; }

/* Cifras: 3 o 4, cifra grande y etiqueta corta */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }
.kpi { border: 1px solid var(--line); border-radius: 16px; padding: 12px 13px; display: grid; gap: 4px; text-decoration: none; align-content: start; }
.kpi .ic { width: 18px; height: 18px; color: var(--ink-3); }
.kpi b { font-size: 1.6rem; font-weight: 600; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi span { font-size: .74rem; color: var(--ink-2); line-height: 1.2; }
.kpi .up, .kpi .down { font-size: .74rem; color: var(--ink-2); } /* el número en tinta; el color, solo en la flecha */
.kpi .up::before { content: "▲ "; color: var(--good); } .kpi .down::before { content: "▼ "; color: var(--crit); }
.meter { height: 8px; border-radius: 99px; background: var(--grid); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--graf); border-radius: 99px; }
.meter.warn i { background: var(--warn); } .meter.crit i { background: var(--crit); }

/* Listas de una línea: qué · quién · fecha; el detalle, al tocar */
.rows { display: grid; }
.trow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); text-decoration: none; min-width: 0; }
.rows > .trow:first-child { border-top: 0; padding-top: 2px; }
.trow b { flex: 1; min-width: 0; font-weight: 500; line-height: 1.3; }
.trow small { font-size: .74rem; color: var(--ink-3); white-space: nowrap; }
details.md summary { cursor: pointer; font-weight: 600; font-size: .88rem; color: var(--ink-2); }

/* Estado: siempre punto de color + texto */
.status { display: inline-flex; align-items: center; gap: 6px; font-size: .76rem; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.status.ok::before { background: var(--good); } .status.mid::before { background: var(--warn); } .status.no::before { background: var(--crit); }

/* Filtros */
.chips { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.chip-btn { flex: none; font-size: .84rem; font-weight: 600; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: #fff; color: var(--ink-2); cursor: pointer; }
.chip-btn[aria-pressed="true"] { background: var(--acento); border-color: var(--acento); color: var(--acento-tinta); }
.seg-c { display: inline-grid; grid-auto-flow: column; background: var(--soft); border-radius: 10px; padding: 3px; gap: 2px; }
.seg-c button { font: inherit; font-weight: 600; font-size: .84rem; border: 0; background: transparent; color: var(--ink-2); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.seg-c button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; font-weight: 600; padding: 11px 14px; border-radius: 12px; background: var(--acento); color: var(--acento-tinta); text-decoration: none; border: 0; cursor: pointer; }

/* Gráficos (SVG): marcas finas, rejilla tenue, texto en tinta, leyenda con 2 series o más */
.chart svg { display: block; overflow: visible; }
.chart .ax { font-size: 10.5px; fill: var(--ink-3); }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart .base { stroke: var(--line); }
.chart .val { font-size: 11px; font-weight: 600; fill: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .78rem; color: var(--ink-2); }
.legend i { width: 9px; height: 9px; border-radius: 3px; background: var(--c); display: inline-block; margin-right: 6px; }
details.data summary { cursor: pointer; font-size: .78rem; font-weight: 600; color: var(--ink-2); }
details.data table { margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font-size: .84rem; }
th, td { padding: 10px 6px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
th { font-size: .66rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
.cell { display: inline-block; width: 14px; height: 14px; border-radius: 50%; }
.cell.ok { background: var(--good); } .cell.mid { background: var(--warn); } .cell.no { box-shadow: inset 0 0 0 2px var(--crit); }

/* Pestañas: abajo en el móvil, riel a la izquierda desde 900 px. Como mucho 5; la primera, Inicio */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(255, 255, 255, .96); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); padding: 0 max(6px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(6px, env(safe-area-inset-left, 0px)); }
.nav a { display: grid; justify-items: center; align-content: center; gap: 3px; min-height: var(--nav-h); color: var(--ink-3); text-decoration: none; font-size: .66rem; font-weight: 600; position: relative; }
.nav a[aria-current="page"] { color: var(--acento); }
.nav a[aria-current="page"] .ic { stroke-width: 2.2; }
.nav .badge { position: absolute; top: 7px; left: calc(50% + 6px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--crit); color: #fff; font-size: .6rem; font-weight: 700; display: grid; place-items: center; }
@media (min-width: 900px) {
  body { padding-left: 92px; }
  .nav { top: 0; right: auto; width: 92px; grid-auto-flow: row; grid-auto-rows: min-content; align-content: start; padding: 22px 0 0; border-top: 0; border-right: 1px solid var(--line); }
  .nav a { min-height: 64px; font-size: .7rem; }
  main { padding-bottom: 48px; }
}

.cc-cab { max-width: 1040px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
#raiz main { padding-top: 12px; }

/* ── TuCloset: piezas propias con las mismas reglas del estilo común ── */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; color: inherit; }
.cc-top .logo { display: flex; align-items: center; gap: 8px; min-height: 44px; text-decoration: none; }
.cc-top .logo img { height: 28px; width: 28px; }
.cc-top b { font-weight: 400; font-size: 1.4rem; letter-spacing: .01em; line-height: 1; color: #111; } /* Bellefair solo tiene un grueso */
.cc-top b em { font-style: normal; color: var(--oro); }
.cc-top small { font-size: .84rem; color: var(--ink-2); }
.head { display: grid; gap: 4px; margin-top: 6px; }
section { display: grid; gap: 14px; align-content: start; }
section[hidden] { display: none; }
.vacio { margin: 0; color: var(--ink-2); font-size: .9rem; }
/* 11/11: Buzón de app@tucloset.app. Los códigos de la última media hora, en grande; los correos de 7 días, en filas que se abren */
.cods { display: grid; gap: 10px; }
.cod { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; border: 1.5px solid var(--acento); border-radius: 14px; padding: 12px 14px; }
.cod b { font-size: 2.1rem; font-weight: 700; letter-spacing: .14em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.cod span { grid-column: 1; font-size: .85rem; color: var(--ink-2); }
.cod button { grid-row: 1 / span 2; grid-column: 2; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: #fff; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; }
.bz { border-top: 1px solid var(--line); }
.bz:first-of-type { border-top: 0; }
.bz summary { list-style: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 0; cursor: pointer; min-height: 44px; }
.bz summary::-webkit-details-marker { display: none; }
.bz .q { font-weight: 600; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bz .h { font-size: .8rem; color: var(--ink-3); white-space: nowrap; }
.bz .a { grid-column: 1 / -1; font-size: .88rem; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bz p { margin: 0 0 12px; font-size: .88rem; color: var(--ink-2); overflow-wrap: anywhere; }

/* tarjetas de cifra: el número en tinta y, si la hay, la comparación debajo */
.kpis:has(> .kpi:nth-child(4):last-child) { grid-template-columns: repeat(2, minmax(0, 1fr)); } /* cuatro cifras: 2 × 2 en el móvil, en fila desde 600 px */
@media (min-width: 600px) { .kpis:has(> .kpi:nth-child(4):last-child) { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi small { font-size: .74rem; color: var(--ink-2); line-height: 1.25; }
.kpi .meter { margin-top: 6px; }
.grande b { font-size: 2.6rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.grande b small { font-size: 1.2rem; font-weight: 500; margin-left: 3px; }
.grande > span { font-size: .84rem; color: var(--ink-2); }
.medida { display: flex; justify-content: space-between; gap: 10px; font-size: .78rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* Os toca: una línea por cosa; quién y cuándo debajo; la explicación al tocar */
.toca { display: grid; }
.toca details { border-top: 1px solid var(--line); }
.toca details:first-child { border-top: 0; }
.toca summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 0; }
.toca summary::-webkit-details-marker { display: none; }
.toca .txt { flex: 1; min-width: 0; display: grid; gap: 3px; }
.toca .que { font-weight: 500; line-height: 1.3; }
.toca .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: .74rem; color: var(--ink-3); }
.toca summary > .ic { width: 16px; height: 16px; color: var(--ink-3); }
.toca details[open] summary > .ic { transform: rotate(180deg); }
.toca p { margin: 0 0 12px; color: var(--ink-2); font-size: .9rem; max-width: 62ch; }
.pila { display: flex; gap: 2px; height: 10px; }
.pila i { display: block; height: 100%; }
.pila i:first-child { border-radius: 99px 0 0 99px; } .pila i:last-child { border-radius: 0 99px 99px 0; } .pila i:only-child { border-radius: 99px; }

/* barras horizontales: nombre y valor, la barra debajo */
.hb { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.hb li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; align-items: baseline; font-size: .88rem; }
.hb .n { overflow-wrap: anywhere; }
.hb .v { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hb .p { grid-column: 1 / -1; height: 14px; } /* 11/11: como las barras de la plantilla común */
.hb .p i { display: block; height: 100%; min-width: 3px; background: var(--graf); border-radius: 3px; }

/* gráficos */
.chart { min-height: 170px; }
.chart .linea { fill: none; stroke: var(--graf); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { display: none; } /* 11/11: sin relleno, como el centro general */
.chart .barra { fill: var(--graf); }
.chart .ax.on { fill: var(--ink); font-weight: 700; }
.chart .rl { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
.chart.hbar { min-height: 0; }
.chart .pt { fill: var(--graf); stroke: #fff; stroke-width: 2; }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:hover + .guia, .chart .guia.on { stroke: var(--line); }
details.data summary, details.md summary { display: inline-flex; align-items: center; min-height: 44px; }
.desliza { overflow-x: auto; }
tbody th { text-transform: none; letter-spacing: 0; font-size: .86rem; font-weight: 500; color: var(--ink); text-align: left; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

/* filas plegables: nombre, avance y cuántas; la lista dentro */
.pleg { display: grid; }
.pleg > details { border-top: 1px solid var(--line); }
.pleg > details:first-child { border-top: 0; }
.pleg summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) 64px auto 16px; gap: 10px; align-items: center; min-height: 52px; }
.pleg summary::-webkit-details-marker { display: none; }
.pleg summary .n { font-weight: 500; line-height: 1.3; }
.pleg summary .meter { height: 6px; }
.pleg summary .meter i { background: var(--good); }
.pleg summary small { font-size: .78rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pleg summary .ic { width: 16px; height: 16px; color: var(--ink-3); }
.pleg details[open] > summary .ic { transform: rotate(180deg); }
.pleg.sin summary { grid-template-columns: minmax(0, 1fr) auto 16px; }
.lst { list-style: none; margin: 0 0 12px; padding: 0; display: grid; }
.lst li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--grid); font-size: .9rem; line-height: 1.3; }
.lst li small { grid-column: 1; font-size: .76rem; color: var(--ink-3); }
.lst li .status { grid-column: 2; grid-row: 1 / span 2; }
.cuerpo { padding: 0 0 16px; font-size: .9rem; overflow-x: auto; }
.cuerpo h1, .cuerpo h2 { font-size: 1.05rem; margin: 16px 0 6px; } .cuerpo h3, .cuerpo h4 { font-size: .95rem; margin: 14px 0 4px; }
.cuerpo p, .cuerpo li { max-width: 70ch; } .cuerpo ul, .cuerpo ol { padding-left: 20px; }
.cuerpo th, .cuerpo td { white-space: normal; text-align: left; vertical-align: top; }

/* infraestructura por fase */
.fase { display: grid; gap: 10px; padding: 14px 0; border-top: 1px solid var(--line); }
.fase:first-of-type { border-top: 0; padding-top: 2px; }
.fase-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.fase-h b { font-weight: 600; }
.fase-h small { font-size: .78rem; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fase .datos { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .78rem; color: var(--ink-2); }
.fase .meter i { background: var(--good); }
.ahora { font-size: .66rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--acento-tinta); background: var(--acento); padding: 2px 8px; border-radius: 99px; margin-left: 6px; vertical-align: 2px; }

  <section id="redes" aria-labelledby="t-redes" hidden>
    <header class="head"><div class="label">Instagram, TikTok y Pinterest</div><h1 id="t-redes">Redes</h1></header>
    <div class="kpis">
      ${kpi('spark', r1(semU ? sumaMed(semU, 'visualizaciones') : null), 'vistas, última semana', comp(semU ? sumaMed(semU, 'visualizaciones') : null, semA ? sumaMed(semA, 'visualizaciones') : null, 'la semana anterior'))}
      ${kpi('check', r1(intSem(semU)), 'guardados por 1.000 vistas', comp(intSem(semU) == null ? null : Math.round(intSem(semU)), intSem(semA) == null ? null : Math.round(intSem(semA)), 'la semana anterior'))}
      ${kpi('home', n0(visDe(0, 6, o => ROJ.test(o))), 'visitas desde redes, 7 días', comp(visDe(0, 6, o => ROJ.test(o)), visDe(7, 13, o => ROJ.test(o)), 'la semana anterior'))}
      ${kpi('user', n0(altas7), 'apuntadas, 7 días', comp(altas7, altasA, 'la semana anterior'))}
    </div>
    <div class="dash">
      ${card('Por red', `<div class="desliza"><table><thead><tr><th scope="col">Red</th><th scope="col">Cuenta</th><th scope="col" class="num">Seguidores</th><th scope="col" class="num">Vistas</th><th scope="col" class="num">Clics</th><th scope="col" class="num">Web</th></tr></thead>
        <tbody>${REDES.map(([rr, n]) => { const sg = segDe(rr), e = ESTR[cuentaDe(n).e || 'falta'] || ESTR.falta; const cel = v => `<td class="num">${v == null ? '—' : n0(v)}</td>`;
          return `<tr><th scope="row">${n}</th><td><span class="status ${e[0]}">${e[1]}</span></td>${cel(sg ? num(sg.seguidores) : null)}${cel(semU ? sumaMed(semU, 'visualizaciones', rr) : null)}${cel(semU ? sumaMed(semU, 'clics_enlace', rr) : null)}${cel(visDe(0, 29, o => o === rr || o.startsWith(rr + '-')))}</tr>`; }).join('')}</tbody></table></div>`,
        { wide: 1, extra: semU ? 'semana ' + esc(semU.slice(6)) + ' · web: 30 días' : 'primera medición: viernes 13/11' })}
      ${card('Lo que mejor funcionó', piezas.length ? hbarras(piezas.map(x => ({ n: (REDES.find(rr => rr[0] === x.red) || [, x.red])[1] + ' · ' + x.pieza, v: x.i, t: r1(x.i) }))) : '<p class="vacio">Sin publicaciones medidas todavía.</p>', { wide: 1, extra: 'guardados y compartidos por 1.000 vistas' })}
    </div>
  </section>

  <section id="mas" aria-labelledby="t-mas" hidden>
    <header class="head"><div class="label">Infraestructura, funciones, fases y equipo</div><h1 id="t-mas">Más</h1></header>
    ${INF.length ? card('Lo que hace falta en cada fase', infraHtml, { wide: 1, extra: 'infraestructura' }) : ''}
    <div class="card grande"><span class="label">Funciones de la app</span><b>${cuenta('hecho')}<small>de ${F.length} hechas</small></b>
      <div class="pila" role="img" aria-label="Funciones: ${ESTADOS.map(e => cuenta(e) + ' ' + ST[e][1].toLowerCase()).join(', ')}">${ESTADOS.filter(cuenta).map(e => `<i style="flex:${cuenta(e)};background:${COL[e]}" data-tip="${ST[e][1]}" data-val="${cuenta(e)} funciones"></i>`).join('')}</div>
      <div class="legend">${ESTADOS.map(e => `<span><i style="--c:${COL[e]}"></i>${ST[e][1]} ${cuenta(e)}</span>`).join('')}</div>
      <div class="pleg">${grupos.map(g => { const fs = F.filter(f => f.g === g); return plegable(g, fs.filter(f => f.e === 'hecho').length, fs.length, listaEst(fs.map(f => ({ e: f.e, t: f.f })))); }).join('')}</div></div>
    <div class="dash">
      ${card('Fases', `<div class="rows">${(P.fases || []).map(f => `<div class="trow" style="display:grid;gap:6px"><div class="medida" style="color:var(--ink)"><span><b style="font-weight:500">${esc(f.n)}</b> · ${esc(f.i.slice(0, 5))}–${esc(f.f.slice(0, 5))}</span><span>${eur(f.m)}</span></div><div class="meter" role="img" aria-label="${esc(f.n)}: ${Math.round(f.a * 100)} %"><i style="width:${Math.round(f.a * 100)}%;background:var(--good)"></i></div></div>`).join('')}</div>`, { extra: P.presupuesto ? `${eur(P.presupuesto.total)} hasta oct. 2027` : '' })}
      ${card('Equipo y legal', `<div class="pleg">${(P.departamentos || []).map(x => plegable(x.n, x.tareas.filter(t => t.e === 'hecho').length, x.tareas.length, listaEst(x.tareas))).join('')}
        ${(P.legal || []).length ? plegable('Legal y riesgos', P.legal.filter(x => x.e === 'hecho').length, P.legal.length, listaEst(P.legal)) : ''}</div>`)}
      ${card('Cuentas', `<div class="rows">${(P.cuentas || []).map(x => { const e = ESTR[x.e] || ESTR.falta; return `<div class="trow"><b>${esc(x.s)}</b><span class="status ${e[0]}">${e[1]}</span>${/^https:\/\//.test(x.u || '') ? `<a class="more" href="${esc(x.u)}" target="_blank" rel="noopener">Abrir</a>` : ''}</div>`; }).join('')}</div>${P.nota_claves ? `<p class="vacio" style="font-size:.78rem">${esc(P.nota_claves)}</p>` : ''}`, { count: (P.cuentas || []).length })}
      ${card('Documentos', `<div class="pleg sin">${(P.docs || []).map(x => `<details><summary><span class="n">${esc(x.t)}</span><small>${esc((x.n || '').replace(/^.*?, /, '').slice(0, 5))}</small>${ic('down')}</summary><div class="cuerpo">${x.html}</div></details>`).join('')}</div>`)}
    </div>
    <a class="btn-s" href="./" style="justify-self:start">${ic('back')}Volver a la app</a>
  </section>
  </main>
  <nav class="nav" aria-label="Secciones">${secciones.map(([k, n, i]) => `<a href="#${k}">${ic(i)}${n}${k === 'inicio' && ya ? `<span class="badge" aria-hidden="true">${ya}</span><span class="sr">, ${ya} para ya</span>` : ''}</a>`).join('')}</nav>`;
  hora0.textContent = 'Datos de las ' + new Date(d.generado).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

  // una sección cada vez; los enlaces de antes (#hoy, #empresa, #toca…) llevan a la suya
  const VIEJAS = { hoy: 'inicio', toca: 'inicio', usuarias: 'cifras', empresa: 'mas', funciones: 'mas', fases: 'mas', equipo: 'mas', cuentas: 'mas' };
  const mostrar = () => { let k = location.hash.slice(1); k = VIEJAS[k] || k; const ok = secciones.some(([s]) => s === k) ? k : 'inicio';
    raiz.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== ok);
    raiz.querySelectorAll('.nav a').forEach(a => a.getAttribute('href') === '#' + ok ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    window.scrollTo(0, 0); dibujarTodo(); };
  addEventListener('hashchange', mostrar); mostrar();
  raiz.addEventListener('toggle', () => dibujarTodo(), true);
  let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(dibujarTodo, 150); });
  raiz.addEventListener('click', e => { const b = e.target.closest('[data-csv]'); if (b) CSV[b.dataset.csv]();
    const v = e.target.closest('[data-todas]'); if (v) { const abre = v.getAttribute('aria-expanded') !== 'true'; v.closest('.card').querySelectorAll('[data-resto]').forEach(x => x.hidden = !abre);
      v.setAttribute('aria-expanded', abre); v.textContent = abre ? 'Ver solo 4' : `Ver las ${PEN.length}`; } });

  // el dato de cada punto o barra al pasar el ratón o tocar (también está en «Ver los datos»)
  const tip = document.getElementById('tip');
  const ver = (el, ev) => { tip.replaceChildren(); const b = document.createElement('b'); b.textContent = el.dataset.val || ''; tip.append(b, document.createTextNode(el.dataset.tip || ''));
    const r = el.getBoundingClientRect(); tip.style.opacity = 1; const w = tip.offsetWidth, hh = tip.offsetHeight, x = ev?.clientX ?? r.left + r.width / 2;
    tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x - w / 2)) + 'px'; tip.style.top = Math.max(8, (ev?.clientY ?? r.top) - hh - 12) + 'px'; };
  const quitar = () => { tip.style.opacity = 0; };
  raiz.addEventListener('pointerover', e => { const el = e.target.closest('[data-val]'); if (el) ver(el, e); });
  raiz.addEventListener('pointermove', e => { const el = e.target.closest('[data-val]'); if (el) ver(el, e); });
  raiz.addEventListener('pointerout', e => { if (e.target.closest('[data-val]')) quitar(); });
  addEventListener('scroll', quitar, { passive: true });
  raiz.addEventListener('click', async e => { const b = e.target.closest('[data-copiar]'); if (!b) return; try { await navigator.clipboard.writeText(b.dataset.copiar); b.textContent = 'Copiado'; setTimeout(() => { b.textContent = 'Copiar'; }, 2000); } catch (er) { b.textContent = 'Mantén pulsado el número'; } });
  // el Buzón se refresca solo cada 20 s mientras la página está a la vista y en Inicio (para los códigos), sin abrir las filas que estén abiertas
  if (d.buzon !== undefined) setInterval(async () => { if (document.hidden || document.getElementById('inicio')?.hidden) return;
    try { const r = await fetch(API + '/api/buzon', { headers: { Authorization: 'Bearer ' + c.token } }); if (!r.ok) return; const j = await r.json(), el = document.getElementById('buzon-c');
      if (!el || el.querySelector('details[open]')) return; const nuevo = buzonHTML(j.buzon); if (el.innerHTML !== nuevo) el.innerHTML = nuevo; } catch (er) { } }, 20000);
})();

</script>
</body>
</html>
